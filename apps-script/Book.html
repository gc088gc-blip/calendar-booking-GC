<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <style>
    body.friend { --accent: #1d1c1a; --tintOk: #eaf3ec; }
    body.public { --tintOk: #fbeee4; }
    .top { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 52px; height: 52px; border-radius: 26px; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; flex-shrink: 0; }
    .brand { font-size: 12px; font-weight: 700; letter-spacing: 2.5px; color: #cc7433; }
    .ttl { font-size: 22px; font-weight: 700; line-height: 1.25; }
    .sub { font-size: 13px; color: var(--muted); }
    .steps { display: flex; align-items: center; gap: 8px; margin: 18px 0 14px; font-size: 12px; color: var(--faint); }
    .steps .st { display: flex; align-items: center; gap: 6px; }
    .steps .st i { width: 20px; height: 20px; border-radius: 10px; background: #e7e3db; color: var(--muted); font-style: normal; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .steps .st.on { color: var(--ink); font-weight: 700; } .steps .st.on i { background: var(--accent); color: var(--accent-ink); }
    .steps .st.done i { background: var(--ink); color: #fff; }
    .steps .ln { flex: 1; height: 1.5px; background: #e2ded6; max-width: 36px; }
    .quick { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; margin-bottom: 12px; scrollbar-width: none; }
    .quick::-webkit-scrollbar { display: none; }
    .qd { flex-shrink: 0; border: 0; background: #fff; border-radius: 12px; padding: 9px 12px; text-align: left; cursor: pointer; font: inherit; display: flex; flex-direction: column; gap: 1px; min-width: 76px; }
    .qd b { font-size: 15px; } .qd span { font-size: 11px; color: var(--muted); }
    .calcard { background: #fff; border-radius: 18px; padding: 14px 12px 12px; }
    .day { height: 52px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 15px; border: 0; background: none; padding: 0; cursor: default; color: #c9c5bc; font: inherit; }

    .day.today { box-shadow: inset 0 0 0 1.5px var(--ink); }
    .hol { display: block; font-size: 9px; line-height: 1.1; color: #c0392b; font-weight: 500; white-space: nowrap; overflow: hidden; max-width: 100%; }
    .lgd { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-top: 10px; padding: 0 4px; }

    .mnote { background: var(--card); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; font-size: 14px; line-height: 1.65; white-space: pre-line; border-left: 4px solid var(--accent); }
    .mnl { display: block; font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 3px; letter-spacing: .5px; }
    .cta2 { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; margin-top: 14px; border: 1.5px dashed #d6d1c7; background: transparent; border-radius: 14px; padding: 13px 14px; text-align: left; cursor: pointer; font: inherit; color: inherit; }
    .fcard { background: #fff; border-radius: 16px; margin-top: 12px; overflow: hidden; }
    .fhead { font-size: 13px; color: var(--muted); padding: 12px 16px 0; }
    .frow { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 2px 16px; }
    .frow + .frow { border-top: 1px solid var(--line2); }
    .fic { width: 20px; height: 20px; stroke: var(--muted); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

    .ranges { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px 14px; }
    .rg { display: inline-flex; align-items: center; gap: 6px; background: #f6f5f2; border-radius: 10px; padding: 7px 10px; font-size: 14px; font-variant-numeric: tabular-nums; }
    .tsel { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: end; padding: 12px 16px 16px; }
    .tsel label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
    .tsel select { appearance: none; -webkit-appearance: none; border: 0; background: #f3f1ec; border-radius: 12px; font: inherit; font-size: 20px; font-weight: 700; padding: 12px 14px; color: var(--ink); text-align: center; font-variant-numeric: tabular-nums; }

    .summary { background: var(--accent); color: var(--accent-ink); border-radius: 16px; padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; }
    .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 75%, transparent); }
    .bar .btn { max-width: 488px; margin: 0 auto; display: flex; width: 100%; min-height: 52px; border-radius: 14px; }
    .months { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px 16px 16px; }
    .mon { min-height: 54px; border-radius: 12px; background: #f6f5f2; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; font: inherit; }
    .mon .y { font-size: 10px; color: var(--faint); } .mon .m { font-size: 15px; font-weight: 500; }
    .mon.on { background: var(--accent); color: var(--accent-ink); }
    .mon.on .y { color: inherit; opacity: .75; } .mon.on .m { font-weight: 700; }
    .chips2 { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 16px 16px; }
    .chips2 button { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer; }
    .chips2 button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
    .check { width: 72px; height: 72px; border-radius: 36px; background: var(--accent); display: flex; align-items: center; justify-content: center; margin: 28px auto 12px; }
    .kv3 { display: flex; gap: 12px; padding: 12px 16px; font-size: 14px; } .kv3 + .kv3 { border-top: 1px solid var(--line2); }
    .kv3 .k { width: 52px; color: var(--muted); flex-shrink: 0; } .kv3 .v { flex: 1; word-break: break-word; }
    .backrow { display: flex; align-items: center; gap: 6px; height: 44px; }
    .backrow button { border: 0; background: #fff; width: 38px; height: 38px; border-radius: 19px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  </style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast"></div>
<?!= include('Cal') ?>

<script>
var BOOT = <?!= boot ?>;
var PUB = BOOT.aud === 'public';
var ME = (BOOT.me && BOOT.me.name) || '我', BRAND = (BOOT.me && BOOT.me.brand) || '', TAGLINE = (BOOT.me && BOOT.me.tagline) || '';
document.body.classList.add(PUB ? 'public' : 'friend');
var WDN = ['日', '一', '二', '三', '四', '五', '六'];
var S = { view: 'month', ym: BOOT.today.slice(0, 7), cache: {}, loading: false, date: null, start: null, end: null, loc: 'both',
          f: { name: '', contact: '', purpose: '', locMode: 'online', place: '' }, month: null, mf: { dur: '', loc: '' }, sending: false, result: null };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function hm(m) { return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
function dOf(ymd) { var a = ymd.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); }
function dtext(ymd) { var d = dOf(ymd); return (d.getMonth() + 1) + '/' + d.getDate() + '（' + WDN[d.getDay()] + '）'; }
function durText(m) { return m % 60 === 0 ? (m / 60) + ' 小時' : (m < 60 ? m + ' 分鐘' : Math.floor(m / 60) + ' 小時 ' + (m % 60) + ' 分'); }
function ymAdd(ym, n) { var d = new Date(+ym.slice(0, 4), +ym.slice(5) - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function ymText(ym) { return ym.slice(0, 4) + ' 年 ' + (+ym.slice(5)) + ' 月'; }
function toast(msg, err) { var t = document.getElementById('toast'); t.innerHTML = '<div class="toast' + (err ? ' err' : '') + '">' + esc(msg) + '</div>'; clearTimeout(toast.t); toast.t = setTimeout(function () { t.innerHTML = ''; }, 3200); }
function run(fn) {
  var args = [].slice.call(arguments, 1);
  return new Promise(function (ok, bad) { var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { bad(e && e.message ? e : new Error(String(e))); }); r[fn].apply(r, args); });
}
var IC = {
  left: '<svg class="ic" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M15 6l-6 6 6 6"/></svg>',
  right: '<svg class="ic" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M9 6l6 6-6 6"/></svg>',
  back: '<svg class="ic" viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M15 6l-6 6 6 6"/></svg>',
  check: '<svg class="ic" viewBox="0 0 24 24" style="width:30px;height:30px;stroke:#fff;stroke-width:2.4"><path d="M5 12l5 5 9-10"/></svg>'
};

/* ---------- 資料 ---------- */
function loadMonth(ym, force) {
  if (S.cache[ym] && !force) return Promise.resolve(S.cache[ym]);
  S.loading = true; render();
  return run('apiMonth', BOOT.aud, BOOT.k, ym).then(function (r) { S.cache[ym] = r.days; S.loading = false; render(); return r.days; })
    .catch(function (e) { S.loading = false; render(); toast(e.message, true); });
}
function dayData(ymd) { var list = S.cache[ymd.slice(0, 7)] || []; for (var i = 0; i < list.length; i++) if (list[i].date === ymd) return list[i]; return null; }
function cover(segs, s, e) {
  var t = s, loc = 'both';
  segs.slice().sort(function (a, b) { return a.s - b.s; }).forEach(function (p) { if (t < e && p.s <= t && p.e > t) { if (p.loc !== 'both') loc = 'online'; t = p.e; } });
  return t >= e ? loc : null;
}
function slotsFor(day, dur) {
  var out = [], seen = {};
  (day.segs || []).forEach(function (p) {
    for (var t = Math.ceil(p.s / 30) * 30; t + dur <= 1440 && t < p.e; t += 30) {
      if (seen[t]) continue;
      var loc = cover(day.segs, t, t + dur);
      if (loc) { seen[t] = 1; out.push({ t: t, loc: loc }); }
    }
  });
  return out.sort(function (a, b) { return a.t - b.t; });
}

/* ---------- 畫面 ---------- */
var FI = {
  person: '<circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/>',
  mail: '<rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="M4 7l8 6 8-6"/>',
  note: '<path d="M5 4.5h14v15H5z"/><path d="M8.5 9h7M8.5 12.5h7M8.5 16h4"/>',
  pin: '<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>'
};
function fi(n) { return '<svg class="fic" viewBox="0 0 24 24">' + FI[n] + '</svg>'; }
function header() {
  if (PUB) return '<div class="col" style="gap:4px">' + (BRAND ? '<div class="brand">' + esc(BRAND) + '</div>' : '') +
    '<div class="ttl">預約跟 ' + esc(ME) + ' 聊聊</div><div class="sub">' + (TAGLINE ? esc(TAGLINE) + ' · ' : '') + '台北時間</div></div>';
  return '<div class="top"><div class="avatar">' + esc(ME.slice(0, 2)) + '</div><div class="col" style="gap:2px"><div class="ttl">跟 ' + esc(ME) + ' 約時間</div><div class="sub">朋友專用連結 · 台北時間</div></div></div>';
}
function steps(n) {
  var L = ['選日子', '選時間', '填資料'];
  return '<div class="steps">' + L.map(function (t, i) {
    var k = i + 1, cls = k === n ? 'on' : k < n ? 'done' : '';
    return (i ? '<span class="ln"></span>' : '') + '<span class="st ' + cls + '"><i>' + (k < n ? '✓' : k) + '</i>' + t + '</span>'; }).join('') + '</div>';
}
function backRow(to, title) { return '<div class="backrow"><button aria-label="上一步" onclick="go(\'' + to + '\')">' + IC.back + '</button><div class="h2">' + title + '</div></div>'; }
function holTag(ymd) { var h = GCCal.holiday(ymd); return h ? '<span class="hol">' + esc(h) + '</span>' : ''; }
function shortD(ymd) { var d = dOf(ymd); return (d.getMonth() + 1) + '/' + d.getDate(); }
function rangeText(day) { return (day.segs || []).map(function (p) { return hm(p.s) + '–' + hm(p.e); }).join('、'); }

function vMonth() {
  var ym = S.ym, days = S.cache[ym];
  var minYm = BOOT.today.slice(0, 7), maxYm = BOOT.rangeEnd.slice(0, 7);
  var h = header() + monthNote(ym) + steps(1);
  var open = days ? days.filter(function (d) { return d.state === 'ok' || d.state === 'online'; }) : [];
  if (open.length) {
    h += '<div class="small muted" style="margin-bottom:6px">' + (ym === minYm ? '最快可以約' : ymText(ym) + ' 可以約') + '</div><div class="quick">' + open.slice(0, 8).map(function (d) {
      return '<button class="qd" onclick="pickDay(\'' + d.date + '\')"><b>' + shortD(d.date) + '（' + WDN[dOf(d.date).getDay()] + '）</b><span>' + esc(rangeText(d).split('、')[0]) + (d.segs.length > 1 ? ' 等' : '') + '</span></button>'; }).join('') + '</div>';
  }
  h += '<div class="calcard"><div class="between" style="margin-bottom:10px"><div class="h2" style="padding-left:4px">' + ymText(ym) + '</div><div class="row" style="gap:6px">' +
    '<button class="arrow" aria-label="上個月" ' + (ym <= minYm ? 'disabled' : '') + ' onclick="nav(-1)">' + IC.left + '</button>' +
    '<button class="arrow" aria-label="下個月" ' + (ym >= maxYm ? 'disabled' : '') + ' onclick="nav(1)">' + IC.right + '</button></div></div>';
  h += '<div class="cal7" style="margin-bottom:6px">' + ['一', '二', '三', '四', '五', '六', '日'].map(function (w) { return '<div class="wkhead">' + w + '</div>'; }).join('') + '</div>';
  if (!days) h += '<div class="spin">讀取中…</div>';
  else {
    var lead = (dOf(ym + '-01').getDay() + 6) % 7;
    h += '<div class="cal7">';
    for (var i = 0; i < lead; i++) h += '<div></div>';
    days.forEach(function (d) {
      var n = +d.date.slice(8), isOpen = d.state === 'ok' || d.state === 'online', cls = 'day ' + d.state + (d.date === BOOT.today ? ' today' : '');
      var inner = '<span>' + n + '</span>' + holTag(d.date) + (isOpen ? '<div class="mk"></div>' : d.state === 'full' ? '<div class="tiny">滿</div>' : '');
      h += isOpen ? '<button class="' + cls + '" onclick="pickDay(\'' + d.date + '\')">' + inner + '</button>' : '<div class="' + cls + '">' + inner + '</div>';
    });
    h += '</div>';
    if (!open.length) h += '<div class="small muted" style="text-align:center;padding:14px 0 4px">這個月沒有開放的時間，看看下個月</div>';
  }
  h += '</div>';
  h += '<div class="lgd"><span><i class="sw" style="background:var(--tintOk)"></i>可以約</span><span><i class="sw" style="background:#e8effb"></i>只剩線上</span><span style="color:#c0392b">紅字 國定假日</span></div>';
  h += '<button class="cta2" onclick="go(\'mform\')"><span class="col" style="gap:2px"><b style="font-size:14px">還不確定哪天？</b><span class="small muted">先留言，只約月份就好</span></span><b style="font-size:13px;white-space:nowrap;color:' + (PUB ? '#cc7433' : 'inherit') + '">只約月份 ›</b></button>';
  return h;
}

function startsFor(day) {
  var out = [], seen = {};
  (day.segs || []).forEach(function (p) { for (var t = Math.ceil(p.s / 30) * 30; t + 30 <= p.e; t += 30) if (!seen[t]) { seen[t] = 1; out.push(t); } });
  return out.sort(function (a, b) { return a - b; });
}
function endsFor(day, s) {
  var out = [];
  for (var e = s + 30; e <= 1440; e += 30) { var loc = cover(day.segs, s, e); if (!loc) break; out.push({ e: e, loc: loc }); }
  return out;
}

function vSlots() {
  var day = dayData(S.date), starts = day ? startsFor(day) : [];
  var h = backRow('month', dtext(S.date) + ' ' + (GCCal.holiday(S.date) ? '<span style="color:#c0392b;font-size:13px">' + esc(GCCal.holiday(S.date)) + '</span>' : '')) + steps(2);
  if (!starts.length) return h + '<div class="fcard" style="padding:18px;text-align:center" class="small muted">這天已經沒有空檔了，換一天看看。</div>';
  if (S.start == null || starts.indexOf(S.start) < 0) S.start = starts[0];
  var ends = endsFor(day, S.start);
  if (!ends.some(function (x) { return x.e === S.end; })) S.end = (ends.filter(function (x) { return x.e === S.start + 60; })[0] || ends[0]).e;
  var loc = cover(day.segs, S.start, S.end);
  h += '<div class="fcard"><div class="fhead">' + esc(ME) + ' 這天有空</div><div class="ranges">' + day.segs.map(function (p) {
    return '<span class="rg">' + hm(p.s) + '–' + hm(p.e) + ' <span class="tag ' + (p.loc === 'online' ? 'online' : 'both') + '">' + (p.loc === 'online' ? '僅線上' : '線上/實體') + '</span></span>'; }).join('') + '</div></div>';
  h += '<div class="fcard"><div class="fhead">你想約幾點到幾點</div><div class="tsel">' +
    '<label>開始<select id="s_start" onchange="setStart(+this.value)">' + starts.map(function (t) { return '<option value="' + t + '"' + (t === S.start ? ' selected' : '') + '>' + hm(t) + '</option>'; }).join('') + '</select></label>' +
    '<span style="padding-bottom:16px;color:var(--faint)">–</span>' +
    '<label>結束<select id="s_end" onchange="setEnd(+this.value)">' + ends.map(function (x) { return '<option value="' + x.e + '"' + (x.e === S.end ? ' selected' : '') + '>' + hm(x.e) + '</option>'; }).join('') + '</select></label></div>' +
    '<div class="tsum"><span>共 ' + durText(S.end - S.start) + '</span><span class="tag ' + (loc === 'online' ? 'online' : 'both') + '">' + (loc === 'online' ? '僅線上' : '線上或' + (PUB ? '台北' : '') + '實體') + '</span></div></div>';
  h += '<div class="small faint" style="margin-top:10px;text-align:center">' + esc(ME) + ' 在忙什麼</div>';
  h += '<div class="bar"><button class="btn" onclick="toForm()">下一步 · ' + dtext(S.date) + hm(S.start) + '–' + hm(S.end) + '</button></div>';
  return h;
}

function vForm() {
  var f = S.f, both = S.loc === 'both';
  var h = backRow('slots', '最後一步') + steps(3);
  h += '<div class="summary"><div class="col" style="gap:2px"><div class="b" style="font-size:17px">' + dtext(S.date) + ' ' + hm(S.start) + '–' + hm(S.end) + '</div><div class="small" style="opacity:.75">' + durText(S.end - S.start) + '</div></div>' +
    '<button class="link" style="color:inherit" onclick="go(\'slots\')">改時間</button></div>';
  h += '<div class="fcard">' +
    '<div class="frow">' + fi('person') + '<input class="finput" id="f_name" maxlength="40" placeholder="你的名字" value="' + esc(f.name) + '"></div>' +
    '<div class="frow">' + fi('mail') + '<input class="finput" id="f_contact" maxlength="100" ' + (PUB ? 'type="email" placeholder="Email（必填，會寄日曆邀請）"' : 'placeholder="LINE 或 Email（選填）"') + ' value="' + esc(f.contact) + '"></div>' +
    '<div class="frow top">' + fi('note') + '<textarea class="finput" id="f_purpose" maxlength="300" placeholder="' + (PUB ? '想聊什麼？例：大三，想問金融業實習' : '要幹嘛？例：吃飯聊近況') + '">' + esc(f.purpose) + '</textarea></div></div>';
  h += '<div class="fcard"><div class="fhead">約哪</div>';
  if (both) {
    h += '<div class="seg2"><button class="' + (f.locMode === 'online' ? 'on' : '') + '" onclick="setLoc(\'online\')">線上（Google Meet）</button><button class="' + (f.locMode === 'inperson' ? 'on' : '') + '" onclick="setLoc(\'inperson\')">' + (PUB ? '台北實體' : '見面') + '</button></div>';
    if (f.locMode === 'inperson') h += '<div class="frow" style="border-top:1px solid var(--line2)">' + fi('pin') + '<input class="finput" id="f_place" maxlength="500" placeholder="地點，或貼 Google 地圖連結" value="' + esc(f.place) + '"></div>' +
      '<div class="small muted" style="padding:0 16px 14px 48px">在 Google 地圖按「分享」→「複製連結」貼上最準</div>';
    else h += '<div class="small muted" style="padding:0 16px 14px">送出後會自動產生 Google Meet 連結</div>';
  } else h += '<div class="small" style="padding:12px 16px 16px">這段時間只開放<b>線上</b>，送出後會自動產生 Google Meet 連結</div>';
  h += '</div>';
  if (PUB) h += '<div class="tiny faint" style="margin-top:14px;text-align:center">資料只用來安排這次見面</div>';
  h += '<div class="bar"><button class="btn" ' + (S.sending ? 'disabled' : '') + ' onclick="submit()">' + (S.sending ? '送出中…' : '送出預約') + '</button></div>';
  return h;
}

function vDone() {
  var r = S.result;
  var h = '<div class="check">' + IC.check + '</div><div class="ttl" style="text-align:center">' + (r.pending ? '已送出' : '約好了！') + '</div><div class="sub" style="text-align:center;margin-top:4px">' +
    (r.pending ? esc(ME) + ' 確認後會用 Email 通知你' : PUB ? '日曆邀請已寄到你的 Email' : '已經排進 ' + esc(ME) + ' 的行事曆') + '</div>';
  h += '<div class="fcard" style="margin-top:20px">' +
    '<div class="kv3"><span class="k">時間</span><span class="v b">' + esc(r.when) + '</span></div>' +
    '<div class="kv3"><span class="k">地點</span><span class="v">' + esc(/^https?:/.test(r.loc) ? 'Google 地圖連結' : r.loc) + '</span></div>' +
    '<div class="kv3"><span class="k">要幹嘛</span><span class="v">' + esc(r.purpose) + '</span></div></div>';
  if (r.pending) h += '<div class="card small muted" style="margin-top:12px;line-height:1.7">這個時間先幫你留著了，看過之後會確認；如果剛好不行，也會用 Email 跟你說，再挑別的時間就好。</div>';
  if (r.meet) h += '<a class="btn block" style="margin-top:12px;text-decoration:none" target="_blank" href="' + esc(r.meet) + '">加入 Google Meet</a>';
  if (r.map) h += '<a class="btn soft block" style="margin-top:10px;text-decoration:none" target="_blank" href="' + esc(r.map) + '">在 Google 地圖打開</a>';
  h += '<div class="small muted" style="text-align:center;margin-top:16px">' + (r.pending ? '要改時間或取消，回覆確認信就可以' : '要取消或改時間，直接跟 ' + esc(ME) + ' 說一聲就好') + '</div>';
  h += '<div style="text-align:center;margin-top:12px"><button class="link" onclick="reset()">再約一個時間</button></div>';
  return h;
}

function monthNote(ym) {
  var t = (BOOT.notes || {})[ym];
  return t ? '<div class="mnote"><span class="mnl">' + ymText(ym) + '</span>' + esc(t) + '</div>' : '';
}
function monthList() { var out = [], ym = BOOT.today.slice(0, 7), end = BOOT.rangeEnd.slice(0, 7); while (ym <= end) { out.push(ym); ym = ymAdd(ym, 1); } return out; }

function vMForm() {
  var f = S.f, mf = S.mf;
  var h = backRow('month', '只約月份');
  h += '<div class="sub" style="margin-top:2px">還不確定哪天沒關係，看到會再跟你喬時間</div>';
  h += '<div class="fcard"><div class="fhead">哪個月</div><div class="months">' + monthList().map(function (ym) {
    return '<button class="mon' + (S.month === ym ? ' on' : '') + '" onclick="setMonth(\'' + ym + '\')"><span class="y">' + ym.slice(0, 4) + '</span><span class="m">' + (+ym.slice(5)) + ' 月</span></button>'; }).join('') + '</div></div>';
  h += '<div class="fcard">' +
    '<div class="frow">' + fi('person') + '<input class="finput" id="f_name" maxlength="40" placeholder="你的名字" value="' + esc(f.name) + '"></div>' +
    '<div class="frow">' + fi('mail') + '<input class="finput" id="f_contact" maxlength="100" ' + (PUB ? 'type="email" placeholder="Email（必填，會用這個聯絡你）"' : 'placeholder="LINE 或 Email（選填）"') + ' value="' + esc(f.contact) + '"></div>' +
    '<div class="frow top">' + fi('note') + '<textarea class="finput" id="f_purpose" maxlength="300" placeholder="要幹嘛？例：想找你聊創業的事">' + esc(f.purpose) + '</textarea></div></div>';
  h += '<div class="fcard"><div class="fhead">大概多久</div><div class="chips2">' + ['30 分鐘', '1 小時', '2 小時', '還不確定'].map(function (d) {
    return '<button class="' + (mf.dur === d ? 'on' : '') + '" onclick="setMF(\'dur\',\'' + d + '\')">' + d + '</button>'; }).join('') + '</div>';
  var locs = ['線上', PUB ? '台北實體' : '見面', '都可以'];
  h += '<div class="fhead" style="padding-top:0">約哪</div><div class="chips2">' + locs.map(function (d) {
    return '<button class="' + (mf.loc === d ? 'on' : '') + '" onclick="setMF(\'loc\',\'' + d + '\')">' + d + '</button>'; }).join('') + '</div></div>';
  h += '<div class="bar"><button class="btn" ' + (S.sending || !S.month ? 'disabled' : '') + ' onclick="submitMonth()">' + (S.sending ? '送出中…' : S.month ? '送出 · ' + ymText(S.month) : '先選月份') + '</button></div>';
  return h;
}

function vMDone() {
  return '<div class="check">' + IC.check + '</div><div class="ttl" style="text-align:center">收到了！</div>' +
    '<div class="fcard" style="margin-top:20px;text-align:center;padding:18px"><div class="b" style="font-size:17px">' + esc(ymText(S.month)) + '</div><div class="small muted" style="margin-top:4px">看到後會再跟你約時間' + (PUB ? '，會寄到你留的 Email' : '') + '</div></div>' +
    '<div style="text-align:center;margin-top:18px"><button class="link" onclick="reset()">回到月曆</button></div>';
}

function render() {
  var v = { month: vMonth, slots: vSlots, form: vForm, done: vDone, mform: vMForm, mdone: vMDone }[S.view];
  document.getElementById('app').innerHTML = v();
}

/* ---------- 動作 ---------- */
function keep() { ['name', 'contact', 'purpose', 'place'].forEach(function (k) { var el = document.getElementById('f_' + k); if (el) S.f[k] = el.value; }); }
function go(v) { keep(); S.view = v; render(); window.scrollTo(0, 0); if (v === 'month') loadMonth(S.ym); }
function nav(n) { S.ym = ymAdd(S.ym, n); render(); loadMonth(S.ym); }
function pickDay(d) { S.date = d; S.start = null; S.end = null; go('slots'); }
function setStart(t) { S.start = t; S.end = null; render(); }
function setEnd(t) { S.end = t; render(); }
function toForm() { var day = dayData(S.date); S.loc = cover(day.segs, S.start, S.end) || 'online'; if (S.loc !== 'both') S.f.locMode = 'online'; go('form'); }
function setLoc(m) { keep(); S.f.locMode = m; render(); }
function setMonth(ym) { keep(); S.month = ym; render(); }
function setMF(k, v) { keep(); S.mf[k] = v; render(); }
function reset() { S.view = 'month'; S.start = S.end = null; S.result = null; S.month = null; S.f.purpose = ''; loadMonth(S.ym, true); render(); }
function check(isMonth) {
  if (!S.f.name.trim()) return '請填你是誰';
  if (PUB && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.f.contact.trim())) return '請填正確的 Email';
  if (!S.f.purpose.trim()) return '請填要幹嘛';
  return '';
}
function submit() {
  keep();
  var err = check(false);
  if (!err && S.loc === 'both' && S.f.locMode === 'inperson' && !S.f.place.trim()) err = '請填地點';
  if (err) return toast(err, true);
  S.sending = true; render();
  run('apiBook', { aud: BOOT.aud, k: BOOT.k, date: S.date, start: S.start, end: S.end, name: S.f.name, contact: S.f.contact, purpose: S.f.purpose,
    locMode: S.loc === 'both' ? S.f.locMode : 'online', place: S.f.place })
    .then(function (r) { S.sending = false; S.result = r; S.view = 'done'; delete S.cache[S.date.slice(0, 7)]; render(); window.scrollTo(0, 0); })
    .catch(function (e) {
      S.sending = false; toast(e.message, true);
      if (/約走|只開放線上/.test(e.message)) { S.start = S.end = null; S.view = 'slots'; loadMonth(S.date.slice(0, 7), true); }
      render();
    });
}
function submitMonth() {
  keep();
  var err = check(true);
  if (err) return toast(err, true);
  S.sending = true; render();
  run('apiRequestMonth', { aud: BOOT.aud, k: BOOT.k, month: S.month, name: S.f.name, contact: S.f.contact, purpose: S.f.purpose, dur: S.mf.dur, locPref: S.mf.loc })
    .then(function () { S.sending = false; S.view = 'mdone'; render(); window.scrollTo(0, 0); })
    .catch(function (e) { S.sending = false; render(); toast(e.message, true); });
}
render();
if (BOOT.first && BOOT.first.ym === S.ym) { S.cache[S.ym] = BOOT.first.days; render(); }
else loadMonth(S.ym);
setTimeout(function () { var n = ymAdd(S.ym, 1); if (n <= BOOT.rangeEnd.slice(0, 7) && !S.cache[n]) run('apiMonth', BOOT.aud, BOOT.k, n).then(function (r) { S.cache[n] = r.days; if (S.view === 'month') render(); }).catch(function () {}); }, 400);   // 先載下個月，切換更快
</script>
</body>
</html>
