    .wbr.done .wbi { color: var(--faint); text-decoration: line-through; }
    .wbx { width: 32px; height: 32px; border: 0; background: none; color: var(--faint); font-size: 20px; line-height: 1; cursor: pointer; flex-shrink: 0; border-radius: 8px; }
    button.wbx:active { background: #f3f1ec; }
  </style>
</head>
<body>
<div class="wrap" id="app"><div class="spin">讀取中…</div></div>
<div id="sheet"></div>
<div id="toast"></div>
<nav class="nav" id="nav"></nav>
<?!= include('Parser') ?>
<?!= include('Cal') ?>
<script>
var BOOT = <?!= boot ?>;
var WDN = ['日', '一', '二', '三', '四', '五', '六'];
var MIN_YM = '2026-09', MAX_YM = '2027-12';
var SWATCH = ['#4f7fd6', '#9467c9', '#cc7433', '#3f9a5e', '#c2527a', '#2f8f9d', '#b08a2e', '#6b7280'];
var A = { boot: null, cfg: null, tab: 'week', wk: null, board: [], boardSaved: '[]', boardSt: '', showPast: false, mode: 'events', anchor: null, sel: null, ev: {}, loading: false,
          picks: [], openDraft: null, setPage: null, hidden: {}, menu: false, inbox: null, filter: '待處理', sheet: null, refs: [], qa: '' };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function hm(m) { return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
function toM(s) { var a = String(s).split(':'); return (+a[0]) * 60 + (+a[1] || 0); }
function dOf(ymd) { var a = ymd.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function addD(s, n) { var d = dOf(s); d.setDate(d.getDate() + n); return ymd(d); }
function md(s) { var d = dOf(s); return (d.getMonth() + 1) + '/' + d.getDate(); }
function mdw(s) { var d = dOf(s); return (d.getMonth() + 1) + '/' + d.getDate() + '（' + WDN[d.getDay()] + '）'; }
function monday(s) { var d = dOf(s); return addD(s, -((d.getDay() + 6) % 7)); }
function durText(m) { return m % 60 === 0 ? (m / 60) + ' 小時' : (m < 60 ? m + ' 分' : Math.floor(m / 60) + '.5 小時'); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function toast(msg, err) { var t = document.getElementById('toast'); t.innerHTML = '<div class="toast' + (err ? ' err' : '') + '">' + esc(msg) + '</div>'; clearTimeout(toast.t); toast.t = setTimeout(function () { t.innerHTML = ''; }, 3000); }
function run(fn) {
  var args = [].slice.call(arguments, 1);
  return new Promise(function (ok, bad) { var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { bad(e && e.message ? e : new Error(String(e))); }); r[fn].apply(r, args); });
}
function fail(e) { A.loading = false; toast(e.message, true); render(); }
function val(id) { var el = document.getElementById(id); return el ? el.value : ''; }
function cal(id) { return A.cfg.calendars.filter(function (c) { return c.id === id; })[0] || { name: '（已移除）', color: '#9a968e', keywords: [] }; }
function tint(hex) { var n = parseInt(hex.slice(1), 16); var r = n >> 16, g = (n >> 8) & 255, b = n & 255; return 'rgba(' + r + ',' + g + ',' + b + ',0.14)'; }
function ref(x) { A.refs.push(x); return A.refs.length - 1; }
function tsel(v, onch) {
  var o = '';
  for (var m = 0; m <= 1440; m += 30) { var t = hm(m); o += '<option value="' + t + '"' + (t === v ? ' selected' : '') + '>' + t + '</option>'; }
  if (toM(v) % 30) o = '<option selected>' + v + '</option>' + o;
  return '<select class="field sm" style="width:88px" onchange="' + onch + '">' + o + '</select>';
}

var IC = {
  cal: '<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  clock: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  inbox: '<svg class="ic" viewBox="0 0 24 24"><path d="M4 13l3-8h10l3 8v6H4z"/><path d="M4 13h5l1 2h4l1-2h5"/></svg>',
  week: '<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18"/><path d="M7 13h4M7 17h7"/></svg>',
  gear: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>',
  plus: '<svg class="ic" viewBox="0 0 24 24" style="stroke:#fff;stroke-width:2.2"><path d="M12 5v14M5 12h14"/></svg>',
  left: '<svg class="ic" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M15 6l-6 6 6 6"/></svg>',
  right: '<svg class="ic" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M9 6l6 6-6 6"/></svg>'
};

/* ================= 資料 ================= */
function range() {
  var first = A.anchor.slice(0, 7) + '-01';
  var last = ymd(new Date(+first.slice(0, 4), +first.slice(5, 7), 0));
  return [monday(first), addD(monday(last), 6)];
}
function loadEvents(force) {
  var r = range(), key = r[0] + '_' + r[1];
  if (A.ev[key] && !force) return render();
  A.loading = true; render();
  run('adminEvents', r[0], r[1]).then(function (list) { A.ev[key] = list; A.loading = false; render(); }).catch(fail);
}
function calsOf(e) { return [e.cal].concat(e.tags || []); }
/** 所屬的行事曆只要有一本沒被藏起來，就顯示 */
function visibleIn(e, hidden) { return calsOf(e).some(function (id) { return !hidden(id); }); }
function barBg(e) {                       // 多個行事曆：色條分段
  var cs = calsOf(e).map(function (id) { return cal(id).color; });
  if (cs.length < 2) return cs[0];
  var step = 100 / cs.length;
  return 'linear-gradient(to bottom,' + cs.map(function (c, i) { return c + ' ' + (i * step) + '% ' + ((i + 1) * step) + '%'; }).join(',') + ')';
}
function tagDots(e) { return (e.tags || []).map(function (id) { return '<i class="tdot" style="background:' + cal(id).color + '"></i>'; }).join(''); }
function eventsOn(day) {
  var r = range(), list = A.ev[r[0] + '_' + r[1]] || [];
  return list.filter(function (e) { return e.sd <= day && e.ed >= day && visibleIn(e, function (id) { return A.hidden[id]; }); });
}
function refresh() { A.ev = {}; if (A.tab === 'week') loadWeek(true); else loadEvents(true); }
function openOf(day) { return (A.cfg.open && A.cfg.open[day]) || []; }
var AUDL = { all: '朋友和新朋友', friend: '只給朋友', public: '只給新朋友' };
var AUDC = { all: '#1d1c1a', friend: '#4f7fd6', public: '#cc7433' };
function openLine(r) { return r.s + '–' + r.e + (r.loc === 'online' ? ' 僅線上' : '') + '（' + AUDL[r.aud || 'all'].replace('只給', '') + '）'; }

/* ================= 本週 ================= */
function wkKey() { return A.wk + '_' + addD(A.wk, 6); }
function loadWeek(force) {
  var k = wkKey();
  if (A.ev[k] && !force) return render();
  render();
  run('adminEvents', A.wk, addD(A.wk, 6)).then(function (list) { A.ev[k] = list; render(); }).catch(fail);
}
function wkShift(n) {
  var t = n === 0 ? monday(A.boot.today) : addD(A.wk, 7 * n);
  if (t < monday(MIN_YM + '-01') || t > monday(MAX_YM + '-31')) return;
  A.wk = t; A.showPast = false; loadWeek(); window.scrollTo(0, 0);
}
function wkHidden(id) { return (A.cfg.weekHide || []).indexOf(id) >= 0; }
function weekOn(day) { return (A.ev[wkKey()] || []).filter(function (e) { return e.sd <= day && e.ed >= day && visibleIn(e, wkHidden); }); }
function toggleWk(i) {
  var id = A.cfg.calendars[i].id, list = (A.cfg.weekHide || []).slice(), k = list.indexOf(id);
  if (k >= 0) list.splice(k, 1); else list.push(id);
  A.cfg.weekHide = list; render();
  run('adminSaveWeekHide', list).then(function (r) { A.cfg.weekHide = r; }).catch(fail);
}
function wkFilter() {
  return '<div class="wkf">' + A.cfg.calendars.map(function (c, i) {
    var off = wkHidden(c.id);
    return '<button class="wf' + (off ? ' off' : '') + '" aria-pressed="' + !off + '" onclick="toggleWk(' + i + ')"><span class="dot" style="background:' + (off ? 'transparent' : c.color) + ';box-shadow:inset 0 0 0 1.5px ' + c.color + '"></span>' + esc(c.name) + '</button>';
  }).join('') + '</div>';
}

function vWeek() {
  var today = A.boot.today, thisMon = monday(today), end = addD(A.wk, 6), list = A.ev[wkKey()];
  var lab = A.wk === thisMon ? '本週' : A.wk === addD(thisMon, 7) ? '下週' : A.wk === addD(thisMon, -7) ? '上週' : md(A.wk) + ' 那週';
  var h = '<div class="between"><div><div class="h1">' + lab + '</div><div class="small muted">' + md(A.wk) + ' – ' + md(end) + '</div></div><div class="row" style="gap:6px">' +
    '<button class="btn soft sm" aria-label="上一週" onclick="wkShift(-1)">' + IC.left + '</button>' +
    (A.wk !== thisMon ? '<button class="btn soft sm" onclick="wkShift(0)">回本週</button>' : '') +
    '<button class="btn soft sm" aria-label="下一週" onclick="wkShift(1)">' + IC.right + '</button></div></div>';
  var pn = pendingN();
  var rv = A.inbox ? A.inbox.filter(function (x) { return x.status === '待審核'; }).length : 0;
  if (pn) h += '<button class="pend" onclick="setTab(\'inbox\')"><span class="pdot"></span>' + (rv ? rv + ' 則預約等你確認' + (pn > rv ? '、另有 ' + (pn - rv) + ' 則留言' : '') : pn + ' 則留言還沒回覆') + '<span class="sp"></span>去看 ›</button>';

  h += wkFilter();
  if (!list) h += '<div class="spin">讀取中…</div>';
  else {
    var past = 0, d;
    for (d = A.wk; d <= end; d = addD(d, 1)) if (d < today) past++;
    h += '<div class="agenda">';
    if (past && !A.showPast) h += '<button class="pastrow" onclick="A.showPast=true;render()">前 ' + past + ' 天已過 · 展開</button>';
    for (d = A.wk; d <= end; d = addD(d, 1)) if (d >= today || A.showPast) h += dayBlock(d, today);
    h += '</div>';
  }
  return h + vBoard();
}

function dayBlock(d, today) {
  var ev = weekOn(d), hol = GCCal.holiday(d);
  var h = '<div class="dy' + (d === today ? ' today' : '') + (d < today ? ' past' : '') + '"><div class="dyh"><span class="dyd' + (hol ? ' red' : '') + '">' + md(d) + ' 週' + WDN[dOf(d).getDay()] + '</span>' +
    (d === today ? '<span class="tbadge">今天</span>' : '') + (hol ? '<span class="dyhol">' + esc(hol) + '</span>' : '') +
    (ev.length ? '' : '<span class="dynone">沒有安排</span>') + '</div>';
  return h + ev.map(function (e) { return agRow(e, d); }).join('') + '</div>';
}
function agRow(e, day) {
  var c = cal(e.cal);
  var t = e.allDay ? '整天' : (e.sd < day ? '　…' : hm(e.sm)) + '–' + (e.ed > day ? '…' : hm(e.em));
  var sub = [e.booked ? '' : e.who, e.meet ? '線上' : e.loc].filter(Boolean).map(esc).join(' · ');
  return '<button class="ag" onclick="editEv(' + ref(e) + ')"><span class="agt">' + t + '</span><span class="agbar" style="background:' + barBg(e) + '"></span>' +
    '<span class="agm"><span class="agtt">' + esc(e.booked && e.who ? '約 ' + e.who : e.title) + (e.booked ? '<span class="bk">預約</span>' : '') + (e.famId ? '<span class="bk fam">家人可見</span>' : '') + '</span>' +
    (sub ? '<span class="ags">' + sub + '</span>' : '') + (e.note ? '<span class="agn">' + esc(e.note) + '</span>' : '') + '</span></button>';
}

/* ================= 白板：固定 8 格，可勾選、可清掉 ================= */
function vBoard() {
  var rows = A.board || [];
  return '<div class="secT"><span>白板</span><span class="sp"></span><span class="tiny faint" id="wb_st">' + esc(A.boardSt || '') + '</span></div>' +
    '<div class="wbl">' + rows.map(function (r, i) {
      return '<div class="wbr' + (r.d ? ' done' : '') + '">' +
        '<button class="wbc' + (r.d ? ' on' : '') + '" aria-label="' + (r.d ? '取消完成' : '標成完成') + '" onclick="boardTick(' + i + ')"' + (r.t ? '' : ' disabled') + '></button>' +
        '<input id="wb' + i + '" class="wbi" value="' + esc(r.t) + '" placeholder="' + (i === 0 && !rows.some(function (x) { return x.t; }) ? '寫下要記得的事…' : '') + '" oninput="boardType(' + i + ',this)" onblur="boardFlush()" onkeydown="if(event.key===\'Enter\'&&!event.isComposing&&event.keyCode!==229){var n=document.getElementById(\'wb' + (i + 1) + '\');if(n)n.focus();else this.blur();}">' +
        (r.t ? '<button class="wbx" aria-label="清掉這一格" onclick="boardClear(' + i + ')">×</button>' : '<span class="wbx"></span>') + '</div>';
    }).join('') + '</div>';
}
function boardSt(t) { A.boardSt = t; var el = document.getElementById('wb_st'); if (el) el.textContent = t; }
function boardJson() { return JSON.stringify(A.board); }
function boardType(i, el) {
  var r = A.board[i], had = !!r.t; r.t = el.value; if (!r.t) r.d = false;
  boardSt('');
  if (had !== !!r.t) {                              // 從空變有字（或反過來）要更新勾選框和 ×
    var row = el.parentNode, c = row.querySelector('.wbc');
    c.disabled = !r.t; if (!r.t) { c.classList.remove('on'); row.classList.remove('done'); }
    var x = row.querySelector('.wbx'); if (r.t && x.tagName !== 'BUTTON') { var b = document.createElement('button'); b.className = 'wbx'; b.setAttribute('aria-label', '清掉這一格'); b.textContent = '×'; b.onclick = function () { boardClear(i); }; row.replaceChild(b, x); }
  }
  clearTimeout(boardType.t); boardType.t = setTimeout(boardFlush, 900);
}
function boardTick(i) { var r = A.board[i]; if (!r.t) return; r.d = !r.d; render(); boardFlush(); }
function boardClear(i) { A.board.splice(i, 1); A.board.push({ t: '', d: false }); render(); boardFlush(); }
function boardFlush() {
  clearTimeout(boardType.t);
  var j = boardJson();
  if (j === A.boardSaved) return;
  boardSt('儲存中…');
  run('adminBoardSave', JSON.parse(j)).then(function () { A.boardSaved = j; if (boardJson() === j) boardSt('已儲存'); })
    .catch(function () { boardSt('沒存到，稍後再試'); });
}
window.addEventListener('beforeunload', function (e) { if (A.board && boardJson() !== A.boardSaved) { boardFlush(); e.preventDefault(); e.returnValue = ''; } });

/* ================= 月曆 ================= */
function vCal() {
  var r = range(), today = A.boot.today, ym = A.anchor.slice(0, 7), openMode = A.mode === 'open', h = '';
  h += '<div class="between"><div class="h1">' + (+ym.slice(0, 4)) + ' 年 ' + (+ym.slice(5)) + ' 月</div><div class="row" style="gap:6px">' +
    '<button class="btn soft sm" ' + (ym <= MIN_YM ? 'disabled' : '') + ' onclick="shift(-1)">' + IC.left + '</button><button class="btn soft sm" onclick="goToday()">今天</button>' +
    '<button class="btn soft sm" ' + (ym >= MAX_YM ? 'disabled' : '') + ' onclick="shift(1)">' + IC.right + '</button></div></div>';
  h += '<div class="seg" style="margin-top:12px"><button class="' + (!openMode ? 'on' : '') + '" onclick="setMode(\'events\')">行程</button><button class="' + (openMode ? 'on' : '') + '" onclick="setMode(\'open\')">開放時段</button></div>';
  if (!openMode) h += '<div class="qa" style="margin-top:12px"><input id="qa" placeholder="一句話新增，例：週四晚上6-9朋友星巴克吃飯" value="' + esc(A.qa) + '" onkeydown="if(event.key===\'Enter\'&&!event.isComposing&&event.keyCode!==229)quick()"><button onclick="quick()" aria-label="新增">' + IC.plus + '</button></div>' +
    '<div class="qmore"><button class="qm" onclick="A.menu=!A.menu;render()">其他新增方式 <span style="font-size:10px">' + (A.menu ? '▲' : '▼') + '</span></button>' +
    (A.menu ? '<div class="qmenu">' +
      '<button onclick="A.menu=false;openManual()">' + fi('clock') + '<span><b>手動新增</b><small>一般表單，一筆一筆填</small></span></button>' +
      '<button onclick="A.menu=false;openWeekly()">' + fi('rep') + '<span><b>每週固定活動</b><small>選每週幾、期間，一次排好</small></span></button>' +
      '<button onclick="A.menu=false;openImport()">' + fi('cal') + '<span><b>整批匯入</b><small>貼上一整串清單</small></span></button></div>' : '') + '</div>';
  if (openMode) h += mnRow(ym);

  h += '<div class="cal7" style="margin-top:14px;margin-bottom:6px">' + ['一', '二', '三', '四', '五', '六', '日'].map(function (w) { return '<div class="wkhead">' + w + '</div>'; }).join('') + '</div><div class="cal7" style="gap:4px">';
  for (var day = r[0]; day <= r[1]; day = addD(day, 1)) {
    var other = day.slice(0, 7) !== ym, past = day < today, op = openOf(day);
    var sel = openMode ? A.picks.indexOf(day) >= 0 : A.sel === day;
    var cls = 'mcell' + (other ? ' other' : '') + (sel ? ' sel' : '') + (openMode && past ? ' past' : '');
    var hol = GCCal.holiday(day);
    h += '<div role="button" tabindex="0" class="' + cls + (openMode ? '' : ' evc') + '" onclick="tapDay(\'' + day + '\')"><div class="mhead"><span class="n' + (day === today ? ' today' : '') + (hol ? ' red' : '') + '">' + (+day.slice(8)) + '</span>' +
      (!openMode && op.length && !past ? '<span class="opn" title="有開放"></span>' : '') + '</div>' + (hol ? '<div class="hl">' + esc(hol) + '</div>' : '');
    if (openMode) {
      op.slice(0, 2).forEach(function (x) { h += '<div class="ol" style="color:' + AUDC[x.aud || 'all'] + '">' + x.s.replace(':00', '') + '–' + x.e.replace(':00', '') + (x.loc === 'online' ? '<span class="on-dot"></span>' : '') + '</div>'; });
      if (op.length > 2) h += '<div class="tiny faint">+' + (op.length - 2) + '</div>';
    } else {
      var list = eventsOn(day);
      var max = hol ? 2 : 3;
      list.slice(0, max).forEach(function (e) {
        var c = cal(e.cal);
        h += '<div class="ech" style="' + (e.allDay ? 'background:' + c.color + ';color:#fff' : 'background:' + tint(c.color) + ';color:' + c.color + ';border-left:3px solid ' + c.color) + '">' + tagDots(e) + esc(e.booked && e.who ? '約 ' + e.who : e.title.replace(/^【[^】]*】/, '')) + '</div>';
      });
      if (list.length > max) h += '<div class="more">還有 ' + (list.length - max) + ' 個</div>';
    }
    h += '</div>';
  }
  h += '</div>';
  if (openMode) h += '<div class="row tiny muted" style="gap:12px;flex-wrap:wrap;margin-top:8px"><span style="color:#1d1c1a">■ 朋友和新朋友</span><span style="color:#4f7fd6">■ 只給朋友</span><span style="color:#cc7433">■ 只給新朋友</span><span class="row" style="gap:4px"><span class="on-dot"></span>僅線上</span></div>';
  else {
    var nh = A.cfg.calendars.filter(function (c) { return A.hidden[c.id]; }).length;
    h += '<div class="lgd">' + A.cfg.calendars.map(function (c, i) {
      var off = A.hidden[c.id];
      return '<button class="lg' + (off ? ' off' : '') + '" aria-pressed="' + !off + '" onclick="toggleCal(' + i + ')"><span class="dot" style="background:' + (off ? 'transparent' : c.color) + ';box-shadow:inset 0 0 0 1.5px ' + c.color + '"></span>' + esc(c.name) + '</button>'; }).join('') +
      '<span class="lg static"><span class="opn"></span>有開放</span>' + (nh ? '<button class="lg reset" onclick="A.hidden={};render()">全部顯示</button>' : '') + '</div>';
  }

  if (A.loading && !openMode) h += '<div class="spin">讀取中…</div>';
  else h += openMode ? vOpenPanel() : vDayPanel(A.sel);
  return h;
}

/* 這個月要給預約者看的話：朋友、新朋友各一份 */
function noteOf(ym) { var n = (A.cfg.notes || {})[ym]; return { f: (n && n.f) || '', p: (n && n.p) || '' }; }
function mnRow(ym) {
  var n = noteOf(ym), has = n.f || n.p;
  var line = [n.f && '朋友：' + n.f.split('\n')[0], n.p && '新朋友：' + n.p.split('\n')[0]].filter(Boolean).join('\n');
  return '<button class="mnrow' + (has ? '' : ' empty') + '" onclick="openNote(\'' + ym + '\')">' + fi('note') +

    '<label class="srow">' + sico('globe', '#cc7433') + '<span class="sbody"><span class="stitle">新朋友預約</span></span><select class="sval" id="bt_p" onchange="saveBookTo()">' + opt(cfg.bookTo.public) + '</select>' + chev() + '</label></div>';
  h += '<div class="grp-note">對方在你開放的時段裡，自己選幾點到幾點。</div>';
  h += '<div class="grp-t">先審核再成立</div><div class="grp">' +
    ['friend', 'public'].map(function (a) {
      var on = !!(cfg.review && cfg.review[a]);
      return '<div class="srow">' + sico(a === 'friend' ? 'friend' : 'globe', a === 'friend' ? '#4f7fd6' : '#cc7433') +
        '<span class="sbody"><span class="stitle">' + (a === 'friend' ? '朋友預約' : '新朋友預約') + '</span><span class="ssub">' + (on ? '先進收件匣，你按通過才成立' : '約了就直接成立') + '</span></span>' +
        '<button class="toggle' + (on ? ' on' : '') + '" aria-label="' + (a === 'friend' ? '朋友' : '新朋友') + '先審核" onclick="saveReview(\'' + a + '\',' + (on ? 'false' : 'true') + ')"></button></div>';
    }).join('') + '</div>' +
    '<div class="grp-note">開著的時候，對方送出後那個時段會先卡住、標成【待審核】，你在收件匣按「通過」或「婉拒」。</div>';

  var nShare = (cfg.shareCals || []).length;
  h += '<div class="grp-t">連結</div><div class="grp">' +
    lrow('friend', 'friend', '#4f7fd6', '朋友連結', '私下傳給朋友') +
    lrow('public', 'globe', '#cc7433', '新朋友連結', '放在 IG、名片、網站') +
    lrow('share', 'eye', '#3f9a5e', '分享我的行程', nShare ? '分享 ' + nShare + ' 個行事曆' : '還沒勾選要分享的行事曆') + '</div>';

  h += '<div class="grp-t">其他</div><div class="grp">' +
    '<button class="srow" onclick="openSheet(\'adv\',{})">' + sico('link', '#6b7280') + '<span class="sbody"><span class="stitle">名字、短網址與通知信箱</span><span class="ssub">' + esc(cfg.notifyEmail) + '</span></span>' + chev() + '</button>' +
    '<button class="srow" onclick="openSheet(\'home\',{})">' + sico('phone', '#6b7280') + '<span class="sbody"><span class="stitle">加到手機桌面</span></span>' + chev() + '</button>' +
    '<a class="srow" target="_blank" href="' + esc(A.boot.sheetUrl) + '">' + sico('sheet', '#2f8f5b') + '<span class="sbody"><span class="stitle">Google 試算表</span><span class="ssub">收件匣的完整紀錄</span></span>' + chev() + '</a></div>';
  return h;
}
function lrow(key, icon, bg, title, sub) {
  return '<div class="srow">' +
    '<button class="srow-main" onclick="openSheet(\'link\',{key:\'' + key + '\'})">' + sico(icon, bg) + '<span class="sbody"><span class="stitle">' + title + '</span><span class="ssub">' + sub + '</span></span></button>' +
    '<button class="sbtn" aria-label="複製' + title + '" onclick="copy(linkOf(\'' + key + '\'))"><svg viewBox="0 0 24 24">' + SI.copy + '</svg></button></div>';
}

/* 連結細節（底部彈出） */
function linkSheet(d) {
  var k = d.key, u = linkOf(k), cfg = A.cfg;
  var t = { friend: '朋友連結', public: '新朋友連結', share: '分享我的行程' }[k];
  var h = '<div class="grab"></div><div class="between"><div class="h2">' + t + '</div><button class="link" onclick="closeSheet()">完成</button></div>';
  if (k === 'share') {
    var sh = cfg.shareCals || [];
    h += '<div class="small muted" style="margin-top:6px">勾選要給看的行事曆，對方只看得到標題和時間。</div><div class="grp" style="margin-top:8px">' + cfg.calendars.map(function (c, i) {
      var on = sh.indexOf(c.id) >= 0;
      return '<button class="srow" onclick="toggleShare(' + i + ')"><span class="sico" style="background:' + c.color + '"><span class="sdot"></span></span><span class="sbody"><span class="stitle">' + esc(c.name) + '</span></span><span class="tick' + (on ? ' on' : '') + '"></span></button>'; }).join('') + '</div>';
  }
  h += '<div class="linkbox"><span>' + esc(u) + '</span></div>';
  h += '<div class="lacts"><button class="btn" onclick="copy(linkOf(\'' + k + '\'))">複製連結</button><a class="btn soft" style="text-decoration:none" target="_blank" href="' + esc(u) + '">預覽</a><button class="btn soft" onclick="showQR(\'' + k + '\')">QR code</button></div>';
  h += '<div id="qr_' + k + '"></div>';
  if (k === 'friend') h += '<button class="link" style="margin-top:14px;color:var(--danger)" onclick="resetToken()">連結外流了？重設朋友連結</button>';
  return h;
}
function advSheet() {
  var cfg = A.cfg;
  return '<div class="grab"></div><div class="between"><div class="h2">名字、短網址與通知信箱</div><button class="link" onclick="closeSheet()">關閉</button></div>' +
    '<div class="grp-t">對外顯示的名字</div><div class="grp pad">' +
    '<input class="field sm" id="s_name" placeholder="名字，例：GC" value="' + esc((cfg.me && cfg.me.name) || '') + '">' +
    '<input class="field sm" id="s_brand" placeholder="品牌名（選填），顯示在新朋友頁最上面" value="' + esc((cfg.me && cfg.me.brand) || '') + '">' +
    '<input class="field sm" id="s_tag" placeholder="一句話（選填），例：職涯、實習、轉職都可以問" value="' + esc((cfg.me && cfg.me.tagline) || '') + '"></div>' +
    '<div class="grp-t">短網址（選填）</div><div class="grp pad">' +
    '<input class="field sm" id="s_sf" placeholder="朋友短網址，例：https://reurl.cc/xxxx" value="' + esc(cfg.shortFriend) + '">' +
    '<input class="field sm" id="s_sp" placeholder="新朋友短網址" value="' + esc(cfg.shortPublic) + '">' +
    '<input class="field sm" id="s_ss" placeholder="分享行程短網址" value="' + esc(cfg.shortShare) + '"></div>' +
    '<div class="grp-note">先按各連結的「複製」，拿複製出來的完整連結到 reurl.cc 縮短，再貼回來；之後複製和 QR code 就會改用短網址。</div>' +
    '<div class="grp-t">預約通知寄到</div><div class="grp pad"><input class="field sm" id="s_ne" value="' + esc(cfg.notifyEmail) + '"></div>' +
    '<div class="grp-t">對外網址</div><div class="grp pad"><input class="field sm" id="s_pu" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(cfg.publicUrl) + '"></div>' +
    '<div class="grp-note">部署「所有人」那個版本的網址，只要設定一次。</div>' +
    '<button class="btn block" style="margin-top:16px" onclick="saveLinks()">儲存</button>';
}
function homeSheet() {
  return '<div class="grab"></div><div class="between"><div class="h2">加到手機桌面</div><button class="link" onclick="closeSheet()">關閉</button></div>' +
    '<div class="grp pad" style="margin-top:12px;line-height:1.8;font-size:14px"><div><b>iPhone</b>：用 Safari 打開後台 → 下方「分享」→「加入主畫面」</div><div><b>Android</b>：用 Chrome 打開後台 → 右上「⋮」→「加到主畫面」</div></div>' +
    '<div class="grp-note">之後點桌面圖示就直接進後台，第一次可能要登入 Google。</div>';
}
function calForm(d) {
  var h = '<div class="grab"></div><div class="between"><div class="h2">' + (d.id ? '編輯行事曆' : '新增行事曆') + '</div><button class="link" onclick="closeSheet()">關閉</button></div>';
  h += '<div class="grp-t">名稱</div><div class="grp pad"><input class="field sm" id="c_name" value="' + esc(d.name) + '" placeholder="例：運動"></div>';
  h += '<div class="grp-t">顏色</div><div class="grp pad"><div class="row" style="flex-wrap:wrap;gap:12px">' + SWATCH.map(function (c) {
    return '<button class="sw' + (c === d.color ? ' on' : '') + '" aria-label="顏色" style="background:' + c + '" onclick="keepCal();A.sheet.d.color=\'' + c + '\';renderSheet()"></button>'; }).join('') + '</div></div>';
  h += '<div class="grp-t">分類關鍵字</div><div class="grp pad"><input class="field sm" id="c_kw" value="' + esc(d.kw) + '" placeholder="例：健身, 跑步"></div>';
  h += '<div class="grp-note">一句話新增時打到這些字，就自動放進這個行事曆。用逗號分開。</div>';
  h += '<button class="btn block" style="margin-top:16px" onclick="saveCal()">' + (d.id ? '儲存' : '建立') + '</button>';
  if (d.id && A.cfg.calendars.length > 1) {
    h += '<div class="grp-t" style="margin-top:28px">刪除這個行事曆</div><div class="grp pad"><div class="small muted">裡面的行程會先搬到：</div><select class="field sm" id="c_move">' +
      A.cfg.calendars.filter(function (c) { return c.id !== d.id; }).map(function (c) { return '<option value="' + esc(c.id) + '">' + esc(c.name) + '</option>'; }).join('') +
      '</select><button class="btn danger sm" onclick="delCal()">搬完後刪除</button></div>';
  }
  return h;
}
function keepCal() { var d = A.sheet.d; if (document.getElementById('c_name')) { d.name = val('c_name'); d.kw = val('c_kw'); } }
function editCal(i) { var c = A.cfg.calendars[i]; openSheet('cal', c ? { id: c.id, name: c.name, color: c.color, kw: (c.keywords || []).join(', ') } : { id: '', name: '', color: SWATCH[4], kw: '' }); }
function saveCal() {
  keepCal();
  var d = A.sheet.d;
  if (!d.name.trim()) return toast('請填名稱', true);
  closeSheet(); toast('儲存中…');
  run('adminCalendarSave', { id: d.id, name: d.name, color: d.color, keywords: d.kw.split(/[,，、\s]+/).filter(Boolean) })
    .then(function (cfg) { A.cfg = cfg; A.ev = {}; toast('已儲存'); render(); }).catch(fail);
}
function delCal() {
  var d = A.sheet.d, to = val('c_move');
  if (!confirm('確定刪除「' + d.name + '」？裡面的行程會搬到「' + cal(to).name + '」。')) return;
  closeSheet(); toast('搬移並刪除中，可能要一點時間…');
  run('adminCalendarDelete', d.id, to).then(function (cfg) { A.cfg = cfg; A.ev = {}; toast('已刪除'); render(); }).catch(fail);
}
/* 家庭日曆 */
function openFamily() { openSheet('family', { loading: true }); run('adminFamilyOptions').then(function (r) { if (A.sheet && A.sheet.type === 'family') { A.sheet.d = { items: r.items, sel: r.current || r.guess || '' }; renderSheet(); } }).catch(fail); }
function familySheet(d) {
  var h = '<div class="grab"></div><div class="between"><div class="h2">家庭日曆</div><button class="link" onclick="closeSheet()">關閉</button></div>';
  h += '<div class="grp-note" style="margin:6px 2px 12px">選好之後，新增或編輯行程時可以打開「讓家人看到」，那筆會複製一份到家庭日曆（只有標題、時間、地點，備註和對象不會給）。家人的行程不會讀進來，也不會影響你的開放時段。</div>';
  if (d.loading) return h + '<div class="spin">讀取中…</div>';
  if (!d.items.length) return h + '<div class="card small muted">目前看不到可以編輯的其他日曆。請確認你的帳號已經在 Google 家庭群組裡，或有人把日曆分享給你（要有編輯權限），再回來這裡。</div>';
  h += '<div class="grp">' + d.items.concat([{ id: '', name: '不使用' }]).map(function (c) {
    var on = d.sel === c.id;
    return '<button class="srow" onclick="A.sheet.d.sel=\'' + esc(c.id) + '\';renderSheet()"><span class="sbody"><span class="stitle">' + esc(c.name) + '</span></span><span class="tick' + (on ? ' on' : '') + '"></span></button>';
  }).join('') + '</div>';
  h += '<button class="btn block" style="margin-top:16px" onclick="saveFamily()">儲存</button>';
  return h;
}
function saveFamily() {
  var id = A.sheet.d.sel; closeSheet();
  run('adminSaveFamilyCal', id).then(function (cfg) { A.cfg = cfg; render(); toast(id ? '已設定家庭日曆' : '不使用家庭日曆'); }).catch(fail);
}
function saveReview(aud, on) {
  run('adminSaveReview', aud, on).then(function (cfg) { A.cfg = cfg; render(); toast(on ? '這類預約會先給你審核' : '這類預約會直接成立'); }).catch(fail);
}
function saveBookTo() { run('adminSaveBookTo', { friend: val('bt_f'), public: val('bt_p') }).then(function (cfg) { A.cfg = cfg; toast('已儲存'); }).catch(fail); }
function saveLinks() {
  run('adminSaveMe', { name: val('s_name'), brand: val('s_brand'), tagline: val('s_tag') }).catch(fail);
  run('adminSaveLinks', { shortFriend: val('s_sf'), shortPublic: val('s_sp'), shortShare: val('s_ss'), publicUrl: val('s_pu'), notifyEmail: val('s_ne') })
    .then(function (b) { A.boot = b; A.cfg = b.cfg; closeSheet(); toast('已儲存'); render(); }).catch(fail);
}
function resetToken() {
  if (!confirm('重設後，舊的朋友連結會馬上失效，要把新連結重新傳給朋友。確定？')) return;
  run('adminResetFriendToken').then(function (b) { A.boot = b; A.cfg = b.cfg; toast('已換新連結'); render(); renderSheet(); }).catch(fail);
}
function showQR(aud) {
  var el = document.getElementById('qr_' + aud);
  if (el.innerHTML) { el.innerHTML = ''; return; }
  if (typeof QRCode === 'undefined') return toast('QR 工具載入失敗，請重新整理', true);
  el.innerHTML = '<div class="qr"><div id="qrc_' + aud + '"></div></div><div class="tiny faint" style="text-align:center">長按圖片可存到相簿</div>';
  new QRCode(document.getElementById('qrc_' + aud), { text: linkOf(aud), width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
}
function copy(text) {
  var done = function () { toast('已複製'); };
  var fallback = function () {
    var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { prompt('複製這個連結：', text); }
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}

/* ================= 骨架 ================= */
function openSheet(type, d) { A.sheet = { type: type, d: d }; renderSheet(); }
function closeSheet() { A.sheet = null; renderSheet(); }
function renderSheet() {
  var el = document.getElementById('sheet');
  if (!A.sheet) { el.innerHTML = ''; return; }
  var t = A.sheet.type, d = A.sheet.d;
  var body = t === 'family' ? familySheet(d) : t === 'mnote' ? noteSheet(d) : t === 'new' ? evForm(d, true) : t === 'edit' ? evForm(d, false) : t === 'import' ? importSheet(d) : t === 'inbox' ? inboxForm(d) : t === 'link' ? linkSheet(d) : t === 'adv' ? advSheet() : t === 'home' ? homeSheet() : calForm(d);
  var sc = el.querySelector('.sheet'), top = sc ? sc.scrollTop : 0;
  var full = t === 'new' || t === 'edit' || t === 'import';
  el.innerHTML = '<div class="sheet-bg" onclick="if(event.target===this)closeSheet()"><div class="sheet' + (full ? ' full' : '') + '">' + body + '</div></div>';
  el.querySelector('.sheet').scrollTop = top;
  el.querySelectorAll('.notein').forEach(grow);
}
function grow(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
function render() {
  if (!A.cfg) return;
  var q = document.getElementById('qa'); if (q) A.qa = q.value;
  A.refs = [];
  var v = { week: vWeek, cal: vCal, inbox: vInbox, set: vSettings }[A.tab];
  var ae = document.activeElement, fid = ae && ae.id && document.getElementById('app').contains(ae) ? ae.id : '', ss = fid && ae.selectionStart, se = fid && ae.selectionEnd;
  document.getElementById('app').innerHTML = v();
  if (fid) { var f = document.getElementById(fid); if (f) { f.focus(); try { f.setSelectionRange(ss, se); } catch (e) {} } }
  renderNav();
}
function renderNav() {
  var items = [['week', IC.week, '本週'], ['cal', IC.cal, '月曆'], ['inbox', IC.inbox, '收件匣'], ['set', IC.gear, '設定']], pn = pendingN();
  document.getElementById('nav').innerHTML = items.map(function (x) { return '<button class="' + (A.tab === x[0] ? 'on' : '') + '" onclick="setTab(\'' + x[0] + '\')">' + x[1] + x[2] +
    (x[0] === 'inbox' && pn ? '<span class="nbadge">' + pn + '</span>' : '') + '</button>'; }).join('');
}
function setTab(t) { A.tab = t; A.setPage = null; A.sheet = null; renderSheet(); renderNav(); render(); window.scrollTo(0, 0); if (t === 'inbox') loadInbox(); if (t === 'cal') loadEvents(); if (t === 'week') loadWeek(); }
function setMode(m) { A.mode = m; A.picks = []; A.openDraft = null; render(); }
function shift(n) {
  var d = dOf(A.anchor.slice(0, 7) + '-01'); d.setMonth(d.getMonth() + n);
  var ym = ymd(d).slice(0, 7); if (ym < MIN_YM || ym > MAX_YM) return;
  A.anchor = ymd(d); A.sel = null; loadEvents();
}
function toggleCal(i) { var id = A.cfg.calendars[i].id; A.hidden[id] = !A.hidden[id]; render(); }
function goToday() { A.anchor = A.boot.today; A.sel = A.boot.today; loadEvents(); }
function tapDay(day) {
  A.menu = false;
  if (A.mode === 'open') {
    if (day < A.boot.today) return;
    var i = A.picks.indexOf(day);
    if (i >= 0) A.picks.splice(i, 1); else A.picks.push(day);
    if (A.picks.length === 1 && i < 0) A.openDraft = null;     // 第一次選：帶入那天現有的時段
    if (!A.picks.length) A.openDraft = null;
  } else A.sel = day;
  render();
}

run('adminBoot').then(function (b) {
  A.boot = b; A.cfg = b.cfg; A.anchor = b.today; A.sel = b.today; A.wk = monday(b.today); A.board = b.board || []; A.boardSaved = JSON.stringify(A.board);
  renderNav(); loadWeek(); loadInbox();
}).catch(function (e) { document.getElementById('app').innerHTML = '<div class="card">' + esc(e.message) + '</div>'; });
</script>
</body>
</html>
