<title>行事曆與預約系統・試玩</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
  :root {
    --ground: #e7e3db; --ink: #1d1c1a; --muted: #6f6b64; --line: #d6d1c7; --paper: #f6f5f2; --card: #ffffff;
    --orange: #cc7433; --blue: #4f7fd6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
  .demo { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 20px; display: flex; flex-direction: column; gap: 10px; }
  .top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand b { font-size: 17px; letter-spacing: .5px; }
  .brand span { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: var(--orange); border: 1.5px solid var(--orange); border-radius: 5px; padding: 1px 6px; }
  .tabs { display: flex; gap: 4px; background: #d9d4ca; border-radius: 12px; padding: 4px; flex-wrap: wrap; }
  .tabs button { border: 0; background: transparent; border-radius: 9px; padding: 8px 14px; font: inherit; font-size: 14px; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(29,28,26,.1); }
  .tabs button:focus-visible, .reset:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .badge { min-width: 18px; height: 18px; border-radius: 9px; background: var(--orange); color: #fff; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px; font-variant-numeric: tabular-nums; }
  .badge:empty { display: none; }
  .reset { margin-left: auto; border: 1.5px solid var(--line); background: transparent; color: var(--muted); border-radius: 10px; padding: 7px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .note { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.6; max-width: 70ch; }
  .note b { color: var(--ink); font-weight: 500; }
  .stage { display: flex; justify-content: center; }
  .phone { width: min(420px, 100%); height: max(640px, calc(100dvh - 130px)); border-radius: 30px; overflow: hidden; background: var(--paper); border: 1px solid var(--line); box-shadow: 0 18px 40px -18px rgba(29,28,26,.35); }
  .phone iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--paper); }
  .mail { width: min(560px, 100%); display: flex; flex-direction: column; gap: 10px; }
  .mail h2 { margin: 6px 0 0; font-size: 18px; text-wrap: balance; }
  .mail .sub { font-size: 12.5px; color: var(--muted); margin: 0; }
  .letter { background: var(--card); border-radius: 12px; border: 1px solid var(--line); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .letter .meta { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; font-variant-numeric: tabular-nums; }
  .letter .subj { font-size: 15px; font-weight: 700; line-height: 1.4; }
  .mailhtml { border-top: 1px solid #efece6; padding-top: 8px; margin: 0 -16px -14px; }
  .mailhtml a { pointer-events: none; }
  .letter .body { font-size: 13.5px; line-height: 1.7; white-space: pre-line; border-top: 1px solid #efece6; padding-top: 8px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 9; max-width: 90vw; text-align: center; }
  @media (max-width: 520px) {
    .demo { padding-inline: 10px; }
    .phone { border-radius: 18px; height: max(600px, calc(100dvh - 150px)); }
    .reset { margin-left: 0; }
  }
</style>

<div class="demo">
  <header class="top">
    <div class="brand"><b>行事曆與預約</b><span>試玩版</span></div>
    <nav class="tabs" role="tablist" aria-label="切換畫面">
      <button id="t_admin" role="tab" aria-selected="true" data-v="admin">後台</button>
      <button id="t_friend" role="tab" aria-selected="false" data-v="friend">朋友連結</button>
      <button id="t_public" role="tab" aria-selected="false" data-v="public">新朋友連結</button>
      <button id="t_share" role="tab" aria-selected="false" data-v="share">分享連結</button>
      <button id="t_mail" role="tab" aria-selected="false" data-v="mail">通知信 <span class="badge" id="badge"></span></button>
    </nav>
    <button class="reset" id="reset">重設示範資料</button>
  </header>
  <p class="note">這是用示範資料跑的完整流程，<b>不會碰到你真的 Google 日曆</b>。在朋友或新朋友連結約時間，切回後台就看得到；「分享連結」是別人看到的唯讀行程；「通知信」是你會收到的信。重新整理頁面就回到示範資料。</p>
  <main class="stage" id="stage"></main>
</div>
<div id="toast"></div>

<script>

/* 在瀏覽器裡模擬 Google 的服務，讓 Code.gs 原封不動跑起來 */
function makeGoogle(owner) {
  var st = { props: {}, cache: {}, sheets: {}, cals: {}, events: {}, mails: [], seq: 0 };
  function sheet(name) {
    var rows = [], s = { rows: rows };
    s.getLastRow = function () { return rows.length; };
    s.appendRow = function (r) { rows.push(r.slice()); };
    s.setFrozenRows = s.setColumnWidth = s.hideSheet = function () {};
    s.deleteRow = function (i) { rows.splice(i - 1, 1); };
    s.setName = function (n) { delete st.sheets[name]; name = n; st.sheets[n] = s; return s; };
    s.getRange = function (a, b, c, d) {
      if (typeof a === 'string') return { getValue: function () { return (rows[0] || [])[0] || ''; }, setValue: function (v) { rows[0] = [v]; } };
      var r = a, col = b, nr = c || 1, nc = d || 1;
      var g = {
        setFontWeight: function () { return g; }, setBackground: function () { return g; }, setFontColor: function () { return g; },
        getValues: function () { var o = []; for (var i = 0; i < nr; i++) { o.push([]); for (var j = 0; j < nc; j++) { var v = (rows[r - 1 + i] || [])[col - 1 + j]; o[i].push(v == null ? '' : v); } } return o; },
        getDisplayValues: function () { return g.getValues().map(function (x) { return x.map(function (v) { return String(v).replace(/^'/, ''); }); }); },
        setValue: function (v) { rows[r - 1][col - 1] = v; },
        setValues: function (vs) { vs.forEach(function (row, i) { row.forEach(function (v, j) { rows[r - 1 + i][col - 1 + j] = v; }); }); }
      };
      return g;
    };
    st.sheets[name] = s; return s;
  }
  var ss = { getSheetByName: function (n) { return st.sheets[n] || null; }, getSheets: function () { return Object.keys(st.sheets).map(function (k) { return st.sheets[k]; }); },
    insertSheet: function (n) { return sheet(n); }, getUrl: function () { return 'https://docs.google.com/spreadsheets/d/DEMO'; }, getId: function () { return 'DEMO'; } };
  sheet('工作表1');

  function parts(d) {   // 試玩版一律用裝置當地時間，避免時區不同造成錯位
    var z = function (n) { return (n < 10 ? '0' : '') + n; };
    return { year: String(d.getFullYear()), month: z(d.getMonth() + 1), day: z(d.getDate()), hour: z(d.getHours()), minute: z(d.getMinutes()) };
  }
  var Utilities = {
    formatDate: function (d, tz, f) {
      var p = parts(d);
      if (f === 'yyyy-MM-dd') return p.year + '-' + p.month + '-' + p.day;
      if (f === 'H') return String(+p.hour); if (f === 'm') return String(+p.minute);
      return p.year + '-' + p.month + '-' + p.day + ' ' + p.hour + ':' + p.minute;
    },
    sleep: function () {},
    getUuid: function () { return 'xxxxxxxx-xxxx-4xxx'.replace(/x/g, function () { return (Math.random() * 16 | 0).toString(16); }); }
  };

  /* ---- 行事曆事件（含每週重複展開） ---- */
  var BY = { SU: 0, MO: 1, TU: 2, WE: 3, TH: 4, FR: 5, SA: 6 };
  function ms(x) { return x.dateTime ? new Date(x.dateTime.slice(0, 19)).getTime() : new Date(x.date + 'T00:00:00').getTime(); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymdL(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function shiftTo(x, day) { return x.dateTime ? { dateTime: day + x.dateTime.slice(10), timeZone: x.timeZone } : { date: day }; }
  function expand(ev, from, to) {
    if (!ev.recurrence) return [ev];
    var exd = [];
    ev.recurrence.forEach(function (x) { var mm = /^EXDATE[^:]*:(.*)$/.exec(x); if (mm) mm[1].split(',').forEach(function (d) { exd.push(d.slice(0, 8)); }); });
    var rule = ev.recurrence[0], days = /BYDAY=([A-Z,]+)/.exec(rule)[1].split(',').map(function (k) { return BY[k]; });
    var until = /UNTIL=(\d{4})(\d{2})(\d{2})/.exec(rule), untilMs = until ? new Date(until[1] + '-' + until[2] + '-' + until[3] + 'T23:59:59').getTime() : Infinity;
    var s0 = ms(ev.start), len = ms(ev.end) - s0, out = [];
    var d = new Date(s0); d.setHours(0, 0, 0, 0);
    var start = Math.max(d.getTime(), from - 86400000 * 2);
    for (var t = new Date(start); t.getTime() <= Math.min(to, untilMs); t.setDate(t.getDate() + 1)) {
      if (t.getTime() < d.getTime() || days.indexOf(t.getDay()) < 0) continue;
      var day = ymdL(t), iid = ev.id + '_' + day.replace(/-/g, '');
      if ((ev.exdates || []).indexOf(iid) >= 0 || exd.indexOf(day.replace(/-/g, '')) >= 0) continue;
      var st0 = shiftTo(ev.start, day), sMs = ms(st0);
      if (sMs + len <= from || sMs >= to) continue;
      var en = ev.start.dateTime ? { dateTime: '', timeZone: ev.end.timeZone } : { date: '' };
      var e = new Date(sMs + len);
      if (en.dateTime !== undefined) en.dateTime = ymdL(e) + 'T' + pad(e.getHours()) + ':' + pad(e.getMinutes()) + ':00'; else en.date = ymdL(e);
      out.push(Object.assign({}, ev, { id: iid, recurringEventId: ev.id, recurrence: undefined, start: st0, end: en }));
    }
    return out;
  }
  function all(cal, from, to) {
    var out = [];
    (st.events[cal] || []).forEach(function (ev) {
      expand(ev, from, to).forEach(function (x) { if (ms(x.end) > from && ms(x.start) < to) out.push(x); });
    });
    return out.sort(function (a, b) { return ms(a.start) - ms(b.start); });
  }
  function findCal(id) { for (var c in st.events) if (st.events[c].some(function (e) { return e.id === id; })) return c; return null; }
  var Calendar = {
    CalendarList: { list: function () {
      var items = Object.keys(st.cals).map(function (id) { return { id: id, summary: st.cals[id].name, accessRole: 'owner' }; });
      return { items: items.concat([{ id: 'family-demo@group.calendar.google.com', summary: '家庭', accessRole: 'writer' }, { id: owner, summary: owner, accessRole: 'owner', primary: true }]) };
    } },
    Freebusy: { query: function (q) {
      var from = new Date(q.timeMin).getTime(), to = new Date(q.timeMax).getTime(), res = {};
      q.items.forEach(function (i) {
        res[i.id] = { busy: all(i.id, from, to).filter(function (e) { return e.start.dateTime || e.transparency === 'opaque'; })
          .map(function (e) { return { start: new Date(ms(e.start)).toISOString(), end: new Date(ms(e.end)).toISOString() }; }) };
      });
      return { calendars: res };
    } },
    Events: {
      insert: function (ev, cal, opt) {
        var e = JSON.parse(JSON.stringify(ev)); e.id = 'ev' + (++st.seq); e.status = 'confirmed';
        if (opt && opt.conferenceDataVersion) e.hangoutLink = 'https://meet.google.com/' + Math.random().toString(36).slice(2, 5) + '-' + Math.random().toString(36).slice(2, 6) + '-' + Math.random().toString(36).slice(2, 5);
        delete e.conferenceData; e.htmlLink = 'https://calendar.google.com/calendar/event?eid=' + e.id;
        (st.events[cal] = st.events[cal] || []).push(e); return e;
      },
      list: function (cal, o) {
        if (!o.singleEvents) return { items: (st.events[cal] || []).slice() };
        return { items: all(cal, new Date(o.timeMin).getTime(), new Date(o.timeMax).getTime()) };
      },
      patch: function (p, cal, id) {
        var list = st.events[cal] || [], e = list.filter(function (x) { return x.id === id; })[0];
        if (!e) {       // 重複行程的某一次：拆成獨立例外
          var mid = id.split('_')[0], m = list.filter(function (x) { return x.id === mid; })[0];
          if (!m) throw new Error('找不到行程');
          (m.exdates = m.exdates || []).push(id);
          e = JSON.parse(JSON.stringify(m)); delete e.recurrence; delete e.exdates; e.id = 'ev' + (++st.seq); list.push(e);
        }
        ['summary', 'location', 'description', 'extendedProperties'].forEach(function (k) { if (p[k] !== undefined) e[k] = p[k]; });
        if (p.conferenceData && !e.hangoutLink) e.hangoutLink = 'https://meet.google.com/' + Math.random().toString(36).slice(2, 5) + '-' + Math.random().toString(36).slice(2, 6) + '-' + Math.random().toString(36).slice(2, 5);
        if (p.start) e.start = p.start.date ? { date: p.start.date } : { dateTime: p.start.dateTime, timeZone: p.start.timeZone };
        if (p.end) e.end = p.end.date ? { date: p.end.date } : { dateTime: p.end.dateTime, timeZone: p.end.timeZone };
        return e;
      },
      move: function (cal, id, dest) {
        var list = st.events[cal] || [], i = -1;
        list.forEach(function (x, k) { if (x.id === id) i = k; });
        if (i < 0) { var c = findCal(id); if (!c) throw new Error('找不到行程'); list = st.events[c]; list.forEach(function (x, k) { if (x.id === id) i = k; }); }
        var e = list.splice(i, 1)[0]; (st.events[dest] = st.events[dest] || []).push(e);
      },
      get: function (cal, id) {
        var e = (st.events[cal] || []).filter(function (x) { return x.id === id; })[0];
        if (!e) throw new Error('Not Found'); return e;
      },
      remove: function (cal, id) {
        var list = st.events[cal] || [], before = list.length;
        st.events[cal] = list.filter(function (x) { return x.id !== id; });
        if (st.events[cal].length === before) {
          var mid = id.split('_')[0], m = st.events[cal].filter(function (x) { return x.id === mid; })[0];
          if (m) (m.exdates = m.exdates || []).push(id);
        }
      }
    }
  };
  var CalendarApp = {
    getCalendarsByName: function () { return []; },
    createCalendar: function (n, o) { var id = 'cal' + (++st.seq) + '@group.calendar.google.com'; st.cals[id] = { name: n, color: o.color }; st.events[id] = []; return { getId: function () { return id; } }; },
    getCalendarById: function (id) { return { setName: function (n) { st.cals[id].name = n; }, setColor: function (c) { st.cals[id].color = c; }, deleteCalendar: function () { delete st.cals[id]; delete st.events[id]; } }; }
  };
  st.events[owner] = [];
  return {
    st: st,
    PropertiesService: { getScriptProperties: function () { return { getProperty: function (k) { return st.props[k] || null; }, setProperty: function (k, v) { st.props[k] = v; }, deleteProperty: function (k) { delete st.props[k]; } }; } },
    CacheService: { getScriptCache: function () { return { get: function (k) { return st.cache[k] || null; }, put: function (k, v) { st.cache[k] = v; }, remove: function (k) { delete st.cache[k]; } }; } },
    SpreadsheetApp: { create: function () { return ss; }, openById: function () { return ss; } },
    Session: { getActiveUser: function () { return { getEmail: function () { return owner; } }; }, getEffectiveUser: function () { return { getEmail: function () { return owner; } }; } },
    LockService: { getScriptLock: function () { return { tryLock: function () { return true; }, releaseLock: function () {} }; } },
    MailApp: { sendEmail: function (o) { st.mails.unshift({ to: o.to, subject: o.subject, body: o.body, html: o.htmlBody, at: new Date() }); } },
    Logger: { log: function () {} },
    Utilities: Utilities, Calendar: Calendar, CalendarApp: CalendarApp,
    ScriptApp: {
      getService: function () { return { getUrl: function () { return 'https://script.google.com/macros/s/DEMO/exec'; } }; },
      getProjectTriggers: function () { return (st.triggers || []).map(function (h) { return { getHandlerFunction: function () { return h; } }; }); },
      deleteTrigger: function (t) { st.triggers = (st.triggers || []).filter(function (h) { return h !== t.getHandlerFunction(); }); },
      newTrigger: function (h) { var b = { timeBased: function () { return b; }, everyDays: function () { return b; }, atHour: function () { return b; }, inTimezone: function () { return b; }, create: function () { (st.triggers = st.triggers || []).push(h); } }; return b; }
    },
    HtmlService: {},
    /* 試玩版不會真的連到 Claude 或 Gemini：固定回一段「看起來像從截圖讀出來」的結果 */
    UrlFetchApp: { fetch: function (url, o) {
      var z = function (n) { return (n < 10 ? '0' : '') + n; }, day = function (plus, wd) { var d = new Date(); if (wd != null) d.setDate(d.getDate() + ((wd - d.getDay() + 7) % 7 || 7)); else d.setDate(d.getDate() + plus); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); };
      var list = [
        { date: day(0, 6), start: '19:00', end: null, allDay: false, title: '跟阿明吃飯', who: '阿明', place: '信義區 鼎泰豐', note: '他說會晚 10 分鐘', sure: true },
        { date: day(0, 0), start: '14:00', end: '16:00', allDay: false, title: '一起看展', who: '阿明', place: '北師美術館', note: '', sure: false }
      ];
      var out = /anthropic/.test(url) ? { content: [{ type: 'text', text: JSON.stringify(list) }] } : { candidates: [{ content: { parts: [{ text: JSON.stringify(list) }] } }] };
      return { getResponseCode: function () { return 200; }, getContentText: function () { return JSON.stringify(out); } };
    } }
  };
}

function bootBackend() {
  var G = makeGoogle('me@example.com');
  var PropertiesService = G.PropertiesService, CacheService = G.CacheService, SpreadsheetApp = G.SpreadsheetApp, Session = G.Session,
      LockService = G.LockService, MailApp = G.MailApp, Logger = G.Logger, Utilities = G.Utilities, Calendar = G.Calendar,
      CalendarApp = G.CalendarApp, ScriptApp = G.ScriptApp, HtmlService = G.HtmlService, UrlFetchApp = G.UrlFetchApp;
/**
 * 行事曆與預約系統 — Google Apps Script 後端
 * 開源專案：一個人用的行程管理＋對外預約網頁
 * 資料：行程存在你的 Google 日曆；設定與收件匣存在 Google 試算表「預約系統」
 */

var TZ = 'Asia/Taipei';
var RANGE_END = '2027-12-31';
var STEP = 30;                       // 時段間隔（分鐘）
var INBOX = '收件匣';
var CFG_SHEET = '_設定';
var COLS = ['ID', '送出時間', '狀態', '類型', '對象', '名字', '聯絡方式', '想約時間', '多久', '要幹嘛', '約哪', '地點', '會議連結', '行事曆ID', '事件ID'];
var WDN = ['日', '一', '二', '三', '四', '五', '六'];
var BYDAY = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
var AUD_NAME = { friend: '朋友', public: '新朋友' };

/** 第一次執行 setup 時會建立的行事曆，之後都在後台「設定 → 行事曆」改 */
var DEFAULT_CALS = [
  { name: '私人', color: '#4f7fd6', keywords: ['朋友', '家人'] },
  { name: '私事·工作相關', color: '#9467c9', keywords: ['會議', '開會'] },
  { name: '副業', color: '#cc7433', keywords: ['諮詢', '面談'] },
  { name: '正職', color: '#3f9a5e', keywords: ['上班', '公司'] }
];

/* ======================= 初次設定（在編輯器手動執行一次） ======================= */

function setup() {
  var props = PropertiesService.getScriptProperties();
  var ss, ssid = props.getProperty('ssid');
  if (ssid) ss = SpreadsheetApp.openById(ssid);
  else { ss = SpreadsheetApp.create('預約系統'); props.setProperty('ssid', ss.getId()); }

  var inbox = ss.getSheetByName(INBOX);
  if (!inbox) { inbox = ss.getSheets()[0]; inbox.setName(INBOX); }
  if (inbox.getLastRow() === 0) {
    inbox.appendRow(COLS);
    inbox.setFrozenRows(1);
    inbox.getRange(1, 1, 1, COLS.length).setFontWeight('bold').setBackground('#1d1c1a').setFontColor('#ffffff');
    inbox.setColumnWidth(10, 280);
  }
  var cs = ss.getSheetByName(CFG_SHEET) || ss.insertSheet(CFG_SHEET);
  cs.hideSheet();

  if (!cs.getRange('A1').getValue()) {
    var cals = DEFAULT_CALS.map(function (c) {
      var cal = CalendarApp.getCalendarsByName(c.name)[0] || CalendarApp.createCalendar(c.name, { color: c.color, timeZone: TZ });
      return { id: cal.getId(), name: c.name, color: c.color, keywords: c.keywords };
    });
    saveConfig_(defaultConfig_(cals));
  }
  var cfg = getConfig_();
  Logger.log('完成！試算表：' + ss.getUrl());
  Logger.log('朋友連結密鑰：' + cfg.audiences.friend.token);
}

function defaultConfig_(cals) {
  return {
    calendars: cals,
    bookTo: { friend: cals[0].id, public: cals[2].id },
    busyAlso: [Session.getEffectiveUser().getEmail()],     // 主日曆的行程也算忙碌
    audiences: {
      friend: { minNoticeH: 4, token: newToken_() },
      public: { minNoticeH: 24 }
    },
    shareCals: [],     // 分享連結要給看的行事曆
    shareToken: newToken_(),

/* ======================= 日期工具 ======================= */

function pad_(n) { return (n < 10 ? '0' : '') + n; }
function ymdOf_(d) { return Utilities.formatDate(d, TZ, 'yyyy-MM-dd'); }
function dateOf_(ymd) { var a = ymd.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); }
function addDaysYmd_(ymd, n) { var d = dateOf_(ymd); d.setDate(d.getDate() + n); return ymdOf_(d); }
function minYmd_(a, b) { return a < b ? a : b; }
function toMin_(hhmm) { var a = String(hhmm).split(':'); return (+a[0]) * 60 + (+a[1] || 0); }
function hhmm_(min) { return pad_(Math.floor(min / 60)) + ':' + pad_(min % 60); }
function isoLocal_(ymd, min) {
  if (min >= 1440) { ymd = addDaysYmd_(ymd, Math.floor(min / 1440)); min = min % 1440; }
  return ymd + 'T' + hhmm_(min) + ':00';
}
function whenText_(ymd, s, e) {
  var d = dateOf_(ymd);
  return (d.getMonth() + 1) + '/' + d.getDate() + '（' + WDN[d.getDay()] + '）' + hhmm_(s) + '–' + hhmm_(e);
}
function durText_(m) { return m % 60 === 0 ? (m / 60) + ' 小時' : (m < 60 ? m + ' 分' : Math.floor(m / 60) + ' 小時 ' + (m % 60) + ' 分'); }
function localParts_(dt) {  // Date → {ymd, min}
  return { ymd: ymdOf_(dt), min: (+Utilities.formatDate(dt, TZ, 'H')) * 60 + (+Utilities.formatDate(dt, TZ, 'm')) };
}

/* ======================= 空檔計算 ======================= */

function openRanges_(cfg, aud, ymd) {
  return (cfg.open[ymd] || []).filter(function (r) { return !r.aud || r.aud === 'all' || r.aud === aud; })
    .map(function (r) { return { s: toMin_(r.s), e: toMin_(r.e), loc: r.loc }; })
    .filter(function (r) { return r.e > r.s; });
}

function busy_(cfg, fromMs, toMs) {
  var ids = cfg.calendars.map(function (c) { return c.id; }).concat(cfg.busyAlso || []);
  var seen = {};
  var items = ids.filter(function (id) { if (seen[id]) return false; seen[id] = 1; return true; }).map(function (id) { return { id: id }; });
  var res = Calendar.Freebusy.query({
    timeMin: new Date(fromMs).toISOString(), timeMax: new Date(toMs).toISOString(), timeZone: TZ, items: items
  });
  var out = [];
  Object.keys(res.calendars || {}).forEach(function (id) {
    (res.calendars[id].busy || []).forEach(function (b) { out.push({ s: new Date(b.start).getTime(), e: new Date(b.end).getTime() }); });
  });
  return out;
}

/** 從區段扣掉忙碌時間。pieces/busy 皆為毫秒 {s,e} */
function subtract_(pieces, busy) {
  busy.forEach(function (b) {
    var next = [];
    pieces.forEach(function (p) {
      if (b.e <= p.s || b.s >= p.e) { next.push(p); return; }
      if (b.s > p.s) next.push({ s: p.s, e: b.s, loc: p.loc });
      if (b.e < p.e) next.push({ s: b.e, e: p.e, loc: p.loc });
    });
    pieces = next;
  });
  return pieces;
}

/** [s,e) 是否被連續的空檔蓋滿；回傳 'both' / 'online' / null */
function cover_(segs, s, e) {
  var t = s, loc = 'both';
  segs.slice().sort(function (a, b) { return a.s - b.s; }).forEach(function (p) {
    if (t < e && p.s <= t && p.e > t) { if (p.loc !== 'both') loc = 'online'; t = p.e; }
  });
  return t >= e ? loc : null;
}

/** 計算多天的狀態與空檔（純函式，方便測試） */
function computeDays_(cfg, aud, fromYmd, toYmd, busy, nowMs) {
  var a = cfg.audiences[aud];
  var today = ymdOf_(new Date(nowMs));
  var earliest = nowMs;                         // 不設提前限制，只擋掉已經過去的時間
  var minDur = STEP;
  var out = [];
  for (var ymd = fromYmd; ymd <= toYmd; ymd = addDaysYmd_(ymd, 1)) {
    var day = { date: ymd, state: '', segs: [] };
    if (ymd < today) day.state = 'past';
    else if (ymd > RANGE_END) day.state = 'none';
    else {
      var ranges = openRanges_(cfg, aud, ymd);
      if (!ranges.length) day.state = 'none';
      else {
        var base = dateOf_(ymd).getTime();
        var pieces = ranges.map(function (r) { return { s: Math.max(base + r.s * 60000, earliest), e: base + r.e * 60000, loc: r.loc }; })
          .filter(function (p) { return p.e > p.s; });
        pieces = subtract_(pieces, busy);
        day.segs = pieces.map(function (p) {
          var s = Math.round((p.s - base) / 60000), e = Math.round((p.e - base) / 60000);
          s = Math.ceil(s / STEP) * STEP;               // 對齊半點
          return { s: s, e: e, loc: p.loc };
        }).filter(function (p) { return p.e - p.s >= minDur; })
          .sort(function (x, y) { return x.s - y.s; });
        if (!day.segs.length) day.state = 'full';
        else day.state = day.segs.some(function (p) { return p.loc === 'both'; }) ? 'ok' : 'online';
      }
    }
    out.push(day);
  }
  return out;
}

/* ======================= 對外 API ======================= */

function apiMonth(aud, k, ym) {

}
function monthData_(cfg, aud, ym) {
  if (!/^\d{4}-\d{2}$/.test(ym)) throw new Error('月份錯誤');
  var from = ym + '-01';
  var d = dateOf_(from); d.setMonth(d.getMonth() + 1); d.setDate(0);
  var to = ymdOf_(d);
  var fromMs = dateOf_(from).getTime(), toMs = dateOf_(addDaysYmd_(to, 1)).getTime() + 3600000;
  var now = Date.now();
  var needBusy = Object.keys(cfg.open).some(function (d) { return d >= from && d <= to && openRanges_(cfg, aud, d).length; });
  var busy = needBusy ? busy_(cfg, fromMs, toMs) : [];
  var days = computeDays_(cfg, aud, from, to, busy, now);
  var bk = bookedIn_(cfg, from, to);
  days.forEach(function (d) { var t = bk.byDay[d.date]; if (t) { d.booked = t.length; d.taken = t; } });
  return { days: days, booked: bk.total };
}

/** 這段期間透過預約頁約的（含待審核），只回傳時間，不回傳是誰 */
function bookedIn_(cfg, from, to) {
  var ids = {}, byDay = {}, total = 0;
  [cfg.bookTo.friend, cfg.bookTo.public].forEach(function (id) { if (id) ids[id] = 1; });
  Object.keys(ids).forEach(function (cid) {
    try {
      var res = Calendar.Events.list(cid, { timeMin: dateOf_(from).toISOString(), timeMax: dateOf_(addDaysYmd_(to, 1)).toISOString(), singleEvents: true, maxResults: 500 });
      (res.items || []).forEach(function (ev) {
        if (ev.status === 'cancelled' || !ev.start.dateTime || !/^透過預約頁/.test(ev.description || '')) return;
        var a = localParts_(new Date(ev.start.dateTime)), b = localParts_(new Date(ev.end.dateTime));
        (byDay[a.ymd] = byDay[a.ymd] || []).push({ s: a.min, e: b.ymd === a.ymd ? b.min : 1440 });
        total++;
      });
    } catch (e) { console.error(e); }
  });
  Object.keys(byDay).forEach(function (k) { byDay[k].sort(function (x, y) { return x.s - y.s; }); });
  return { byDay: byDay, total: total };
}

function clean_(s, max) { return String(s == null ? '' : s).replace(/[\u0000-\u001f]/g, ' ').trim().slice(0, max); }
function mapUrl_(place) {
  if (!place) return '';
  if (/^https?:\/\/(www\.)?(google\.[a-z.]+\/maps|maps\.google\.|maps\.app\.goo\.gl|goo\.gl\/maps)/i.test(place)) return place;
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(place);
}
function isEmail_(s) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s); }

function apiBook(req) {

  var ymd = String(req.date), s = +req.start, e = +req.end, dur = e - s, locMode = req.locMode === 'inperson' ? 'inperson' : 'online';

      ['誰', name + (contact ? '（' + contact + '）' : '')], ['要幹嘛', purpose], ['多久', durText_(dur)], ['地點', /^https?:/i.test(locText) ? 'Google 地圖連結（點下方按鈕）' : locText],
      ['行事曆', calName_(cfg, calId) + (review ? '（已先卡住這個時段）' : '（要取消直接刪行程）')]

}

/** 分享連結：只回傳勾選的行事曆，只有標題和時間；預約進來的行程不顯示對方資料 */

/** 分享頁一個月的行程；快取 1 分鐘，讓分享頁開得快 */
function shareData_(cfg, ym) {

  var timeMin = dateOf_(from).toISOString(), timeMax = d.toISOString();
  var shared = {}, colorOf = {}, out = [], cals = [];
  cfg.calendars.forEach(function (c) { colorOf[c.id] = c.color; if (cfg.shareCals.indexOf(c.id) >= 0) { shared[c.id] = 1; cals.push({ name: c.name, color: c.color }); } });
  if (!cals.length) return { events: [], calendars: [] };
  cfg.calendars.forEach(function (c) {
    var token = null;
    do {
      var opt = { timeMin: timeMin, timeMax: timeMax, singleEvents: true, orderBy: 'startTime', maxResults: 2500 };
      if (token) opt.pageToken = token;
      var res = Calendar.Events.list(c.id, opt);
      (res.items || []).forEach(function (ev) {
        if (ev.status === 'cancelled') return;
        var pv = (ev.extendedProperties && ev.extendedProperties.private) || {};
        var mine = [c.id].concat(tagsOf_(cfg, pv.tags, c.id)).filter(function (id) { return shared[id]; });
        if (!mine.length) return;                                   // 沒有任何一本有分享
        var booked = /^透過預約頁/.test(ev.description || '');
        var o = { title: booked ? '已有預約' : (ev.summary || '（無標題）'), color: colorOf[mine[0]] };
        if (ev.start.date) { o.allDay = true; o.sd = ev.start.date; o.ed = addDaysYmd_(ev.end.date, -1); o.sm = 0; o.em = 1440; }
        else {
          var a = localParts_(new Date(ev.start.dateTime)), b = localParts_(new Date(ev.end.dateTime));
          o.allDay = false; o.sd = a.ymd; o.sm = a.min; o.ed = b.ymd; o.em = b.min;
        }
        out.push(o);
      });
      token = res.nextPageToken;
    } while (token);
  });
  out.sort(function (x, y) { return (x.sd + (x.allDay ? '0' : '1') + ('000' + x.sm).slice(-4)) < (y.sd + (y.allDay ? '0' : '1') + ('000' + y.sm).slice(-4)) ? -1 : 1; });
  return { events: out, calendars: cals };
}

/* ======================= 行事曆事件 ======================= */

function insertEvent_(calId, o) {
  var ev = { summary: o.title, location: o.loc || '', description: o.desc || o.note || '' };
  var tags = (o.tags || []).join(',');
  if (o.who || o.note || tags || o.famId) ev.extendedProperties = { private: { who: o.who || '', note: o.note || '', tags: tags, famId: o.famId || '' } };
  if (o.allDay) {
    ev.start = { date: o.ymd };
    ev.end = { date: addDaysYmd_(o.endYmd || o.ymd, 1) };
    ev.transparency = 'opaque';
  } else {
    ev.start = { dateTime: isoLocal_(o.ymd, o.s), timeZone: TZ };
    ev.end = { dateTime: isoLocal_(o.endYmd || o.ymd, o.e), timeZone: TZ };
  }
  if (o.repeat && o.repeat.length) {
    var until = (o.until && o.until <= RANGE_END ? o.until : RANGE_END).replace(/-/g, '');
    ev.recurrence = ['RRULE:FREQ=WEEKLY;BYDAY=' + o.repeat.map(function (d) { return BYDAY[d]; }).join(',') + ';UNTIL=' + until + 'T155959Z'];
    var ex = (o.exdates || []).filter(function (d) { return /^\d{4}-\d{2}-\d{2}$/.test(d); });
    if (ex.length) ev.recurrence.push(o.allDay ? 'EXDATE;VALUE=DATE:' + ex.map(function (d) { return d.replace(/-/g, ''); }).join(',')
      : 'EXDATE;TZID=' + TZ + ':' + ex.map(function (d) { return d.replace(/-/g, '') + 'T' + hhmm_(o.s).replace(':', '') + '00'; }).join(','));
  }
  var opt = {};
  if (o.attendees && o.attendees.length) { ev.attendees = o.attendees.map(function (e) { return { email: e }; }); opt.sendUpdates = 'all'; }
  if (o.meet) {
    ev.conferenceData = { createRequest: { requestId: Utilities.getUuid(), conferenceSolutionKey: { type: 'hangoutsMeet' } } };
    opt.conferenceDataVersion = 1;
  }
  return Calendar.Events.insert(ev, calId, opt);
}

function meetLink_(ev) {
  if (ev.hangoutLink) return ev.hangoutLink;
  var ep = ev.conferenceData && ev.conferenceData.entryPoints;
  if (ep) for (var i = 0; i < ep.length; i++) if (ep[i].entryPointType === 'video') return ep[i].uri;
  return '';
}

function calName_(cfg, id) {
  var c = cfg.calendars.filter(function (x) { return x.id === id; })[0];
  return c ? c.name : '';
}

function esc_(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

function adminEvents(fromYmd, toYmd) {
  requireOwner_();
  var cfg = getConfig_();
  var timeMin = dateOf_(fromYmd).toISOString(), timeMax = dateOf_(addDaysYmd_(toYmd, 1)).toISOString();
  var out = [];
  cfg.calendars.forEach(function (c) {
    var token = null;
    do {
      var opt = { timeMin: timeMin, timeMax: timeMax, singleEvents: true, orderBy: 'startTime', maxResults: 2500 };
      if (token) opt.pageToken = token;
      var res = Calendar.Events.list(c.id, opt);
      (res.items || []).forEach(function (ev) {
        if (ev.status === 'cancelled') return;
        var o = { cal: c.id, id: ev.id, rid: ev.recurringEventId || '', title: ev.summary || '（無標題）', loc: ev.location || '',
          desc: (ev.description || '').slice(0, 500), meet: meetLink_(ev), booked: /^透過預約頁/.test(ev.description || ''),
          who: (ev.extendedProperties && ev.extendedProperties.private && ev.extendedProperties.private.who) || '' };
        var pv = (ev.extendedProperties && ev.extendedProperties.private) || {};
        o.tags = tagsOf_(cfg, pv.tags, c.id);
        o.famId = pv.famId || '';
        o.note = pv.note != null ? String(pv.note) : (o.booked ? '' : (ev.description || '').slice(0, 2000));   // 自己的行程：備註就是說明欄
        if (ev.start.date) {
          o.allDay = true; o.sd = ev.start.date; o.ed = addDaysYmd_(ev.end.date, -1); o.sm = 0; o.em = 1440;
        } else {

          o.allDay = false; o.sd = a.ymd; o.sm = a.min; o.ed = b.ymd; o.em = b.min;
        }
        out.push(o);
      });
      token = res.nextPageToken;
    } while (token);
  });
  out.sort(function (x, y) { return (x.sd + pad_(x.allDay ? 0 : 1) + ('000' + x.sm).slice(-4)) < (y.sd + pad_(y.allDay ? 0 : 1) + ('000' + y.sm).slice(-4)) ? -1 : 1; });
  return out;
}

/** 同一筆行程另外歸到哪些行事曆（去掉已刪的、跟主要重複的） */
function tagsOf_(cfg, raw, main) {
  var ok = {};
  cfg.calendars.forEach(function (c) { ok[c.id] = 1; });
  var seen = {}, list = Array.isArray(raw) ? raw : String(raw || '').split(',');
  return list.map(function (x) { return String(x).trim(); }).filter(function (x) {
    if (!x || !ok[x] || x === main || seen[x]) return false; seen[x] = 1; return true;
  });
}
function validCal_(cfg, id) { if (!cfg.calendars.some(function (c) { return c.id === id; })) throw new Error('找不到這個行事曆'); }

function adminCreate(o) {
  requireOwner_();
  var cfg = getConfig_();
  validCal_(cfg, o.cal);
  if (!o.title) throw new Error('請填內容');
  var who = clean_(o.who, 40);
  var famId = o.family ? famWrite_(cfg, o, '') : '';
  var ev = insertEvent_(o.cal, { title: clean_(o.title, 200), ymd: o.date, endYmd: o.endDate, s: +o.s, e: +o.e, allDay: !!o.allDay,
    loc: clean_(o.loc, 500), repeat: o.repeat, until: o.until, exdates: o.exdates, meet: !!o.meet && !o.allDay, who: who, note: note_(o.note), tags: tagsOf_(cfg, o.tags, o.cal), famId: famId });
  if (rememberWho_(cfg, who)) saveConfig_(cfg);
  return { id: ev.id, people: cfg.people, meet: meetLink_(ev) };
}

/** 整批匯入：跳過同一天、同時間、同標題已經存在的行程 */
function adminImport(items) {
  requireOwner_();
  var cfg = getConfig_();
  items = (items || []).filter(function (o) { return o && o.title && /^\d{4}-\d{2}-\d{2}$/.test(o.date); });
  if (!items.length) throw new Error('沒有可以匯入的行程');
  if (items.length > 300) throw new Error('一次最多 300 筆');
  var from = items.reduce(function (m, o) { return o.date < m ? o.date : m; }, items[0].date);
  var to = items.reduce(function (m, o) { var e = o.until || o.endDate || o.date; return e > m ? e : m; }, items[0].date);
  var seen = {};
  cfg.calendars.forEach(function (c) {
    var token = null;
    do {
      var opt = { timeMin: dateOf_(from).toISOString(), timeMax: dateOf_(addDaysYmd_(to, 1)).toISOString(), singleEvents: true, maxResults: 2500 };
      if (token) opt.pageToken = token;
      var res = Calendar.Events.list(c.id, opt);
      (res.items || []).forEach(function (ev) {
        if (ev.status === 'cancelled') return;
        var st = ev.start.date ? ev.start.date + '|all' : (function (p) { return p.ymd + '|' + p.min; })(localParts_(new Date(ev.start.dateTime)));
        seen[st + '|' + (ev.summary || '')] = 1;
      });
      token = res.nextPageToken;
    } while (token);
  });
  var added = 0, skipped = 0;
  items.forEach(function (o) {
    validCal_(cfg, o.cal);
    var key = o.date + '|' + (o.allDay ? 'all' : +o.s) + '|' + clean_(o.title, 200);
    if (seen[key]) { skipped++; return; }
    insertEvent_(o.cal, { title: clean_(o.title, 200), ymd: o.date, endYmd: o.endDate, s: +o.s, e: +o.e, allDay: !!o.allDay,
      loc: clean_(o.loc, 500), repeat: o.repeat, until: o.until, exdates: o.exdates, who: clean_(o.who, 40), note: note_(o.note), tags: tagsOf_(cfg, o.tags, o.cal) });
    rememberWho_(cfg, clean_(o.who, 40));
    seen[key] = 1; added++;
  });
  saveConfig_(cfg);
  return { added: added, skipped: skipped };
}

function adminUpdate(o) {
  requireOwner_();
  var cfg = getConfig_();
  validCal_(cfg, o.cal);
  var who = clean_(o.who, 40);
  var note = note_(o.note);
  var famId = o.famId || '';
  if (!o.rid) {                                   // 重複行程的單一次不同步家庭日曆（整串在新增時就決定）
    if (o.family) famId = famWrite_(cfg, o, famId);
    else if (famId) { famRemove_(cfg, famId); famId = ''; }
  }
  var patch = { summary: clean_(o.title, 200), location: clean_(o.loc, 500),
    extendedProperties: { private: { who: who, note: note, tags: tagsOf_(cfg, o.tags, o.newCal || o.cal).join(','), famId: famId } } };
  if (!o.booked) patch.description = note;       // 預約來的行程保留原本的預約資料
  if (rememberWho_(cfg, who)) saveConfig_(cfg);
  if (o.allDay) { patch.start = { date: o.date, dateTime: null }; patch.end = { date: addDaysYmd_(o.endDate || o.date, 1), dateTime: null }; }
  else { patch.start = { dateTime: isoLocal_(o.date, +o.s), timeZone: TZ, date: null }; patch.end = { dateTime: isoLocal_(o.endDate || o.date, +o.e), timeZone: TZ, date: null }; }
  var popt = {};
  if (o.addMeet && !o.allDay) { patch.conferenceData = { createRequest: { requestId: Utilities.getUuid(), conferenceSolutionKey: { type: 'hangoutsMeet' } } }; popt.conferenceDataVersion = 1; }
  Calendar.Events.patch(patch, o.cal, o.id, popt);
  if (o.newCal && o.newCal !== o.cal) {
    validCal_(cfg, o.newCal);
    Calendar.Events.move(o.cal, o.rid || o.id, o.newCal);   // 重複行程會整串一起移
  }
  return { ok: true, people: cfg.people };
}

function adminDelete(cal, id, rid, all) {
  requireOwner_();
  var cfg = getConfig_();
  validCal_(cfg, cal);
  var target = all && rid ? rid : id;
  if (!rid || all) {                              // 家庭日曆那份一起刪
    try { var ev = Calendar.Events.get(cal, target); var pv = (ev.extendedProperties && ev.extendedProperties.private) || {}; if (pv.famId) famRemove_(cfg, pv.famId); } catch (e) { console.error(e); }
  }
  Calendar.Events.remove(cal, target);
  return { ok: true };
}

/* ======================= 截圖判讀：Claude（付費、快）或 Gemini（免費、較慢） ======================= */
/* 金鑰存在「指令碼屬性」，不在試算表、也不在程式碼裡。貼哪一家的金鑰，就用哪一家 */

var CLAUDE_MODELS = ['claude-haiku-4-5-20251001', 'claude-haiku-4-5'];   // 最便宜的 Claude
var AI_MODELS = ['gemini-flash-latest', 'gemini-3.8-flash', 'gemini-3.5-flash', 'gemini-flash-lite-latest', 'gemini-3.5-flash-lite'];
function aiKey_() {
  var p = PropertiesService.getScriptProperties();
  var k = p.getProperty('AI_KEY') || p.getProperty('GEMINI_KEY') || '';
  return { key: k, provider: /^sk-ant-/.test(k) ? 'claude' : 'gemini' };
}
function aiStatus_() {
  var a = aiKey_();
  return { set: !!a.key, tail: a.key ? a.key.slice(-4) : '', provider: a.key ? a.provider : '' };
}
function adminSaveAiKey(key) {
  requireOwner_();
  var props = PropertiesService.getScriptProperties();
  key = String(key || '').replace(/\s+/g, '');                     // 複製時多帶的空白、換行去掉
  if (!key) { props.deleteProperty('AI_KEY'); props.deleteProperty('GEMINI_KEY'); return aiStatus_(); }
  if (!/^[A-Za-z0-9_\-.]{20,300}$/.test(key)) throw new Error('金鑰格式不對，請整串複製貼上（Claude 是 sk-ant- 開頭，Gemini 是 AQ. 或 AIza 開頭）');
  props.setProperty('AI_KEY', key); props.deleteProperty('GEMINI_KEY');
  return aiStatus_();
}

function aiPrompt_() {
  var now = new Date(), today = ymdOf_(now);
  return [
    '你是行程助理。圖片是一段聊天截圖（LINE、IG、Messenger 之類）。',
    '找出裡面已經約定好、或正在提議的見面與活動，只輸出一個 JSON 陣列，不要輸出任何其他文字或說明。',
    '今天是 ' + today + '（星期' + WDN[now.getDay()] + '），時區台北。',
    '「明天」「下週四」「這週六」這類相對日期要換算成實際日期；沒寫年份就用今天之後最近的那個日期。',
    '每一筆格式：{"date":"YYYY-MM-DD","start":"HH:MM 或 null","end":"HH:MM 或 null","allDay":true 或 false,',
    '"title":"簡短標題，例如「跟阿明吃飯」","who":"對方的名字或暱稱，看不出來就空字串","place":"地點，沒有就空字串",',
    '"note":"其他重要細節，例如要帶的東西，沒有就空字串","sure":true 或 false（日期時間是否已經講定）}',
    '只有時間點沒有結束時間時 end 給 null。完全沒有活動就輸出 []。'
  ].join('\n');
}

/** 讀一張截圖，回傳裡面約好的行程（還沒寫進日曆，後台確認後才匯入） */
function adminParseImage(b64, mime) {
  requireOwner_();
  var a = aiKey_();
  if (!a.key) throw new Error('還沒設定截圖判讀的金鑰（設定 → 截圖判讀）');
  if (!/^image\/(png|jpeg|webp)$/.test(mime)) throw new Error('只支援 PNG、JPG 截圖');
  if (!b64 || b64.length > 8000000) throw new Error('圖片太大，請截小一點');
  return cleanAiEvents_(a.provider === 'claude' ? claudeRead_(a.key, b64, mime) : geminiRead_(a.key, b64, mime));
}

/** Claude（Messages API） */
function claudeRead_(key, b64, mime) {
  var body = { max_tokens: 1500, temperature: 0,
    messages: [{ role: 'user', content: [{ type: 'image', source: { type: 'base64', media_type: mime, data: b64 } }, { type: 'text', text: aiPrompt_() }] }] };
  var last = 0, started = Date.now();
  for (var i = 0; i < CLAUDE_MODELS.length; i++) {
    body.model = CLAUDE_MODELS[i];
    for (var attempt = 0; attempt < 3; attempt++) {
      if (Date.now() - started > 45000) break;
      var res = UrlFetchApp.fetch('https://api.anthropic.com/v1/messages', {
        method: 'post', contentType: 'application/json', muteHttpExceptions: true, payload: JSON.stringify(body),
        headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01' } });
      var code = res.getResponseCode(), txt = res.getContentText();
      last = code;
      if (code === 200) {
        try { return JSON.parse(txt).content.map(function (c) { return c.text || ''; }).join(''); } catch (e) { return ''; }
      }
      if (code === 401) throw new Error('Claude 金鑰無效（401），請到設定重新貼一次');
      if (code === 403) throw new Error('這組 Claude 金鑰沒有權限（403），請到 console.anthropic.com 確認');
      if (code === 400 && /credit balance/i.test(txt)) throw new Error('Claude 帳戶餘額不足，請到 console.anthropic.com → Billing 儲值');
      if (code === 429 || code === 500 || code === 529 || code === 503) { Utilities.sleep(1500 * (attempt + 1)); continue; }   // 太忙或太頻繁：等一下再試
      break;                                                       // 404 型號名稱不對 → 換下一個
    }
  }
  if (last === 429) throw new Error('Claude 暫時請求太多（429），過一分鐘再試');
  if (last >= 500) throw new Error('Claude 現在太忙（' + last + '），過幾分鐘再按一次「判讀」');
  throw new Error('判讀失敗（' + last + '），稍後再試');
}

/** Gemini（免費額度） */
function geminiRead_(key, b64, mime) {
  var body = { contents: [{ parts: [{ text: aiPrompt_() }, { inline_data: { mime_type: mime, data: b64 } }] }],
    generationConfig: { responseMimeType: 'application/json', temperature: 0.1 } };
  var cfg = getConfig_(), tried = [cfg.aiModel].concat(AI_MODELS).filter(function (m, i, a) { return m && /^gemini/.test(m) && a.indexOf(m) === i; });
  var last = 0, started = Date.now();
  for (var i = 0; i < tried.length; i++) {
    for (var attempt = 0; attempt < 3; attempt++) {
      if (Date.now() - started > 45000) break;                   // 最多等 45 秒，不要讓畫面卡太久
      var res = UrlFetchApp.fetch('https://generativelanguage.googleapis.com/v1beta/models/' + tried[i] + ':generateContent', {
        method: 'post', contentType: 'application/json', headers: { 'x-goog-api-key': key }, payload: JSON.stringify(body), muteHttpExceptions: true });

      }

      if (code === 401) throw new Error('Gemini 不接受這組金鑰（401）。新建立的 AQ. 金鑰有時要等幾分鐘才生效；還是不行就到 AI Studio 重新建立一組');
      if (code === 403) throw new Error('這組金鑰沒有權限，請確認是在 Google AI Studio 建立的');
      if (code === 500 || code === 502 || code === 503 || code === 504) { Utilities.sleep(1500 * (attempt + 1)); continue; }   // Gemini 太忙：等一下再試
      break;                                                     // 404 型號不存在、429 這個型號額度用完 → 換下一個型號
    }
  }
  if (last === 429) throw new Error('今天的免費額度用完了，明天再試或改用手動輸入');
  if (last >= 500) throw new Error('Gemini 現在太忙（' + last + '），過幾分鐘再按一次「判讀」');
  throw new Error('判讀失敗（' + last + '），稍後再試');

function cleanAiEvents_(text) {
  var list, raw = String(text || '').replace(/```(json)?/g, '').trim();

  if (!Array.isArray(list)) list = list && Array.isArray(list.events) ? list.events : [];
  var hm = function (x) { var m = /^(\d{1,2}):(\d{2})$/.exec(String(x || '')); return m && +m[1] < 24 && +m[2] < 60 ? (+m[1]) * 60 + (+m[2]) : null; };
  return list.slice(0, 20).map(function (x) {
    if (!x || !/^\d{4}-\d{2}-\d{2}$/.test(x.date)) return null;
    var s = hm(x.start), e = hm(x.end), allDay = !!x.allDay || s == null;
    if (!allDay && (e == null || e <= s)) e = Math.min(s + 60, 1440);
    return { date: x.date, s: allDay ? 0 : s, e: allDay ? 1440 : e, allDay: allDay, title: clean_(x.title, 100) || '（未命名）',
      who: clean_(x.who, 40), loc: clean_(x.place, 200), note: note_(x.note).slice(0, 300), sure: x.sure !== false };
  }).filter(Boolean);
}

var BOARD_SHEET = '_白板';
function boardSheet_() {
  var ss = ss_(), sh = ss.getSheetByName(BOARD_SHEET);
  if (!sh) { sh = ss.insertSheet(BOARD_SHEET); sh.hideSheet(); }
  return sh;
}
/** 白板：固定 8 格，每格 { t: 文字, d: 做完了沒 } */
var BOARD_N = 8;
function blankBoard_() { var a = []; for (var i = 0; i < BOARD_N; i++) a.push({ t: '', d: false }); return a; }
function getBoard_() {
  var v = boardSheet_().getRange('A1').getValue(), rows = [];
  if (v) {
    try {
      var o = JSON.parse(v);
      if (Array.isArray(o)) rows = o.map(function (n) { return { t: String(n.t || ''), d: !!(n.d || n.done) }; });   // 便條舊格式
      else if (o && Array.isArray(o.items)) rows = o.items.map(function (n) { return { t: String(n.t || ''), d: !!n.d }; });
      else if (o && o.t) rows = String(o.t).split('\n').map(function (t) { return { t: t.trim(), d: false }; });           // 一整塊文字的舊格式
    } catch (e) {}
  }
  rows = rows.filter(function (r) { return r.t; });
  if (rows.length > BOARD_N) {                       // 超過 8 件，多的併進最後一格，不會不見
    var extra = rows.slice(BOARD_N - 1).map(function (r) { return r.t; }).join(' / ');
    rows = rows.slice(0, BOARD_N - 1).concat([{ t: extra, d: false }]);
  }
  while (rows.length < BOARD_N) rows.push({ t: '', d: false });
  return rows;
}
function adminBoard() { requireOwner_(); return getBoard_(); }
function adminBoardSave(items) {
  requireOwner_();
  if (!Array.isArray(items)) throw new Error('格式不對');
  var rows = items.slice(0, BOARD_N).map(function (n) { return { t: clean_(n && n.t, 300), d: !!(n && n.d) }; });
  while (rows.length < BOARD_N) rows.push({ t: '', d: false });
  boardSheet_().getRange('A1').setValue(JSON.stringify({ items: rows }));
  return rows;
}

function adminSetOpen(dates, ranges) {

function adminCalendarDelete(id, moveTo) {
  requireOwner_();
  var cfg = getConfig_();
  validCal_(cfg, id); validCal_(cfg, moveTo);
  if (id === moveTo) throw new Error('要移到另一個行事曆');
  var token = null, moved = 0, failed = 0;
  do {
    var opt = { singleEvents: false, maxResults: 2500, showDeleted: false };
    if (token) opt.pageToken = token;
    var res = Calendar.Events.list(id, opt);
    (res.items || []).forEach(function (ev) {
      if (ev.status === 'cancelled' || ev.recurringEventId) return;
      try { Calendar.Events.move(id, ev.id, moveTo); moved++; } catch (e) { failed++; }
    });
    token = res.nextPageToken;
  } while (token);
  if (failed) throw new Error('有 ' + failed + ' 個行程搬不過去，行事曆先保留。已搬 ' + moved + ' 個。');
  CalendarApp.getCalendarById(id).deleteCalendar();
  cfg.calendars = cfg.calendars.filter(function (c) { return c.id !== id; });
  ['friend', 'public'].forEach(function (a) { if (cfg.bookTo[a] === id) cfg.bookTo[a] = moveTo; });
  saveConfig_(cfg);
  return cfg;
}

, '學弟', '學妹', '主管', '老闆', '客戶', '爸媽', '爸爸', '媽媽', '男友', '女友', '老婆', '老公'];\n\n  var PERIODS = '凌晨|半夜|清晨|早上|上午|早|中午|下午|午後|傍晚|晚上|夜晚|晚';\n  function periodOf(w) {\n    if (!w) return null;\n    if (/凌晨|半夜/.test(w)) return 'late';\n    if (/清晨|早上|上午|^早$/.test(w)) return 'am';\n    if (w === '中午') return 'noon';\n    return 'pm';\n  }\n  /* 把「九月二十號、三點、兩個小時、星期五」這類中文數字換成阿拉伯數字，其餘文字不動 */\n  function cnDigits(t) {\n    return t.replace(/([零〇一二兩三四五六七八九十]{1,3})(?=\\s*(?:月|日|號|点|點|時|個?半?小時|個?鐘頭|分鐘|分|刻))/g, function (all, n, off, str) {\n      var prev = str.charAt(off - 1);\n      if (/[期週拜]/.test(prev) && /^[一二三四五六日]$/.test(n)) return all;     // 星期一 日 之類不動\n      var v = cnNum(n.replace(/〇/g, '零')); return v == null || isNaN(v) ? all : String(v);\n    });\n  }\n\n  function parse(text, now, calendars, people) {\n    now = now || new Date();\n    calendars = calendars || [];\n    var raw = text;\n    var t = cnDigits(normalize(text));\n    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());\n    var r = { who: '', title: '', date: null, s: null, e: null, allDay: false, loc: '', calIndex: 0, calReason: '', repeat: null, dateGuessed: false, timeGuessed: false };\n    var m, WDC = '[一二三四五六日天1-7]';\n\n    // 1. 重複\n    if ((m = t.match(new RegExp('每(?:個)?(?:週|星期)\\\\s*(' + WDC + '(?:\\\\s*[到至\\\\-、,，和]\\\\s*' + WDC + ')*)')))) {\n      r.repeat = wdList(m[1].replace(/\\s/g, '')); t = t.replace(m[0], ' ');\n    } else if ((m = t.match(/每天|每日/))) {\n      r.repeat = [0, 1, 2, 3, 4, 5, 6]; t = t.replace(m[0], ' ');\n    } else if ((m = t.match(/每個?(平日|工作日)/))) {\n      r.repeat = [1, 2, 3, 4, 5]; t = t.replace(m[0], ' ');\n    } else if ((m = t.match(/每個?週末/))) {\n      r.repeat = [6, 0]; t = t.replace(m[0], ' ');\n    }\n\n    // 1b. 重複的結束日：「到 12/31」「至2027/1/15」\n    if (r.repeat && (m = t.match(/(?:到|至|直到|until)\\s*(?:(\\d{4})\\s*[\\/\\-.年]\\s*)?(\\d{1,2})\\s*[\\/月]\\s*(\\d{1,2})\\s*[日號]?/i))) {\n      var uy = m[1] ? +m[1] : today.getFullYear(), ud = new Date(uy, +m[2] - 1, +m[3]);\n      if (!m[1] && ud < today) ud.setFullYear(uy + 1);\n      r.until = ymd(ud); t = t.replace(m[0], ' ');\n    }\n\n    // 2. 日期\n    var date = null, evening = false;\n    // 日期區間「9/25～9/28」→ 連續整天\n    if ((m = t.match(/(\\d{1,2})\\s*\\/\\s*(\\d{1,2})\\s*(?:[（(][^）)]{1,3}[）)])?\\s*-\\s*(\\d{1,2})\\s*\\/\\s*(\\d{1,2})\\s*(?:[（(][^）)]{1,3}[）)])?/))) {\n      var d1 = new Date(today.getFullYear(), +m[1] - 1, +m[2]), d2 = new Date(today.getFullYear(), +m[3] - 1, +m[4]);\n      if (d1 < addDays(today, -30)) { d1.setFullYear(d1.getFullYear() + 1); d2.setFullYear(d2.getFullYear() + 1); }\n      if (d2 < d1) d2.setFullYear(d2.getFullYear() + 1);\n      date = d1; r.endDate = ymd(d2); t = t.replace(m[0], ' ');\n    }\n    if (date) { /* 已是區間 */ }\n    else if ((m = t.match(/(\\d{4})\\s*[\\/\\-.年]\\s*(\\d{1,2})\\s*[\\/\\-.月]\\s*(\\d{1,2})\\s*[日號]?/))) {\n      date = new Date(+m[1], +m[2] - 1, +m[3]); t = t.replace(m[0], ' ');\n    } else if ((m = t.match(/(\\d{1,2})\\s*(?:\\/|月)\\s*(\\d{1,2})\\s*[日號]?/))) {\n      date = new Date(today.getFullYear(), +m[1] - 1, +m[2]);\n      if (date < addDays(today, -30)) date.setFullYear(date.getFullYear() + 1);\n      t = t.replace(m[0], ' ');\n    } else if ((m = t.match(/大後天/))) { date = addDays(today, 3); t = t.replace(m[0], ' '); }\n    else if ((m = t.match(/後天/))) { date = addDays(today, 2); t = t.replace(m[0], ' '); }\n    else if ((m = t.match(/明晚/))) { date = addDays(today, 1); evening = true; t = t.replace(m[0], ' '); }\n    else if ((m = t.match(/明天|明日/))) { date = addDays(today, 1); t = t.replace(m[0], ' '); }\n    else if ((m = t.match(/今晚/))) { date = today; evening = true; t = t.replace(m[0], ' '); }\n    else if ((m = t.match(/今天|今日/))) { date = today; t = t.replace(m[0], ' '); }\n    else if ((m = t.match(new RegExp('(下下|下|這|本)?\\\\s*(?:個)?(?:週|星期)\\\\s*(' + WDC + ')')))) {\n      var target = /\\d/.test(m[2]) ? (+m[2]) % 7 : WD[m[2]];\n      var mondayIdx = (today.getDay() + 6) % 7, targetIdx = (target + 6) % 7;\n      if (m[1] === '下' || m[1] === '下下') date = addDays(today, -mondayIdx + 7 * (m[1] === '下' ? 1 : 2) + targetIdx);\n      else if (m[1] === '這' || m[1] === '本') date = addDays(today, -mondayIdx + targetIdx);\n      else date = addDays(today, (target - today.getDay() + 7) % 7);\n      t = t.replace(m[0], ' ');\n    } else if ((m = t.match(/(^|[^\\d期週拜])(\\d{1,2})\\s*[號日](?![遊])/))) {       // 只寫「20號」＝這個月（過了就下個月）\n      var dd = +m[2];\n      if (dd >= 1 && dd <= 31) {\n        date = new Date(today.getFullYear(), today.getMonth(), dd);\n        if (date < today) date = new Date(today.getFullYear(), today.getMonth() + 1, dd);\n        t = t.replace(m[0], m[1] + ' ');\n      }\n    }\n    if (!date && r.repeat) {\n      for (var k = 0; k < 7; k++) { var d7 = addDays(today, k); if (r.repeat.indexOf(d7.getDay()) >= 0) { date = d7; break; } }\n    }\n    if (!date) { date = today; r.dateGuessed = true; }\n    r.date = ymd(date);\n\n    t = t.replace(/[（(]\\s*[一二三四五六日天]\\s*[）)]/g, ' ');     // 「（三）」這種星期標註\n    if (r.endDate && r.endDate !== r.date) r.allDay = true;\n\n    // 3. 整天\n    if ((m = t.match(/一整天|整天|全天/))) { r.allDay = true; t = t.replace(m[0], ' '); }\n\n    // 4. 長度\n    var dur = null;\n    if ((m = t.match(/(\\d+(?:\\.\\d+)?)\\s*(?:個)?\\s*(半)?\\s*(?:小時|鐘頭|hr|h)(半)?/i))) {\n      dur = parseFloat(m[1]) * 60 + ((m[2] || m[3]) ? 30 : 0); t = t.replace(m[0], ' ');\n    } else if ((m = t.match(/半小時|半個小時|半個鐘頭/))) { dur = 30; t = t.replace(m[0], ' '); }\n    else if ((m = t.match(/(\\d+)\\s*(?:分鐘|min)/i))) { dur = +m[1]; t = t.replace(m[0], ' '); }\n\n    // 5. 時間（數字、中文、「下午3點」「15:00」「3pm」都可以混著寫）\n    var P = '(' + PERIODS + ')?\\\\s*';\n    var H = '(\\\\d{1,2})';\n    var MI = '(?:\\\\s*[:.：](\\\\d{2})|\\\\s*[點点時]\\\\s*(半|\\\\d{1,2}\\\\s*分?|\\\\d刻)?)?\\\\s*(am|pm|a\\\\.m\\\\.|p\\\\.m\\\\.)?';\n    var MR = '(?:\\\\s*[:.：](\\\\d{2})|\\\\s*[點点時]\\\\s*(半|\\\\d{1,2}\\\\s*分?|\\\\d刻)?|(?=\\\\s*(?:am|pm)))\\\\s*(am|pm|a\\\\.m\\\\.|p\\\\.m\\\\.)?';   // 單一時間一定要有「點」或「:」或 am/pm\n    var reRange = new RegExp(P + H + MI + '\\\\s*(?:-|到|至|~)\\\\s*' + P + H + MI, 'i');\n    var reOne = new RegExp(P + H + MR, 'i');\n    var anyP = t.match(new RegExp(PERIODS));\n    var gPeriod = evening ? 'pm' : (anyP ? periodOf(anyP[0]) : null);\n    function minPart(x) {\n      if (!x) return 0; x = String(x).replace(/\\s|分/g, '');\n      if (x === '半') return 30; if (/刻$/.test(x)) return (+x.charAt(0)) * 15; return parseInt(x, 10) || 0;\n    }\n    function to24(h, per, ap, guessPm) {\n      ap = ap ? ap.toLowerCase().charAt(0) : '';\n      if (ap === 'p') return h < 12 ? h + 12 : h;\n      if (ap === 'a') return h === 12 ? 0 : h;\n      if (per === 'pm') return h < 12 ? h + 12 : h;\n      if (per === 'noon') return h <= 2 ? (h === 12 ? 12 : h + 12) : h;\n      if (per === 'am' || per === 'late') return h === 12 ? 0 : h;\n      if (guessPm && h >= 1 && h <= 7) { r.timeGuessed = true; return h + 12; }\n      return h;\n    }\n    if (!r.allDay && (m = t.match(reRange)) && +m[2] <= 24 && +m[7] <= 24) {\n      var p1 = periodOf(m[1]) || gPeriod, p2 = periodOf(m[6]);\n      var ap1 = m[5] || (!m[5] && m[10] && !p1 ? m[10] : '');                // 「3-5pm」→ 開始也算 pm\n      var hs = to24(+m[2], p1, ap1, !m[10] && !p2);\n      var s = hs * 60 + minPart(m[3] || m[4]);\n      var he = to24(+m[7], p2 || (m[10] ? null : p1 === 'noon' ? 'pm' : p1), m[10], false);\n      var e = he * 60 + minPart(m[8] || m[9]);\n      if (e <= s && e + 720 > s && !m[10] && !p2) e += 720;       // 「下午3-6」「6-9」→ 結束也算下午\n      r.s = s; r.e = Math.min(e, 1440);\n      t = t.replace(m[0], ' ');\n    } else if (!r.allDay && (m = t.match(reOne)) && +m[2] <= 24) {\n      r.s = to24(+m[2], periodOf(m[1]) || gPeriod, m[5], true) * 60 + minPart(m[3] || m[4]);\n      r.e = Math.min(r.s + (dur || 60), 1440);\n      t = t.replace(m[0], ' ');\n    }\n    t = t.replace(new RegExp(PERIODS, 'g'), function (w) { return /^晚$|^早$/.test(w) ? w : ' '; });   // 時段詞不進標題\n    t = t.replace(     a.apiRequestMonth({ aud: 'friend', k: cfg.audiences.friend.token, month: d.getFullYear() + '-' + pad2(d.getMonth() + 1), name: '阿杰', contact: '', purpose: '想找你聊創業的事', dur: '1 小時', locPref: '實體' });
    d.setMonth(d.getMonth() + 1);
    a.apiRequestMonth({ aud: 'public', k: '', month: d.getFullYear() + '-' + pad2(d.getMonth() + 1), name: '林同學', contact: 'lin@example.com', purpose: '大三，想問金融業實習', dur: '30 分鐘', locPref: '線上' });
  } catch (e) { console.warn(e); }
  badge();
}

function badge() { var n = B.G.st.mails.length; document.getElementById('badge').textContent = n ? String(n) : ''; }
function toast(m) { var t = document.getElementById('toast'); t.innerHTML = '<div class="toast">' + m + '</div>'; clearTimeout(toast.t); toast.t = setTimeout(function () { t.innerHTML = ''; }, 2600); }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

function show(v) {
  current = v;
  ['admin', 'friend', 'public', 'share', 'mail'].forEach(function (k) { document.getElementById('t_' + k).setAttribute('aria-selected', String(k === v)); });
  var stage = document.getElementById('stage');
  if (v === 'mail') {
    var mails = B.G.st.mails;
    stage.innerHTML = '<section class="mail"><h2>收到的通知信</h2><p class="sub">每筆預約或「只約月份」留言都會寄一封。最新的在最上面。</p>' +
      (mails.length ? mails.map(function (m) {
        return '<article class="letter"><div class="meta"><span>寄給 ' + esc(m.to) + '</span><span>' + pad2(m.at.getHours()) + ':' + pad2(m.at.getMinutes()) + '</span></div>' +
          '<div class="subj">' + esc(m.subject) + '</div>' + (m.html ? '<div class="mailhtml">' + m.html + '</div>' : '<div class="body">' + esc(m.body) + '</div>') + '</article>';
      }).join('') : '<p class="sub">還沒有信。</p>') + '</section>';
    return;
  }
  var cfg = B.api.getConfig_(), html;
  if (v === 'admin') { slowFirst = true; html = TPL_ADMIN.replace('<?!= boot ?>', JSON.stringify({ here: cfg.publicUrl + '?admin', me: cfg.me })); }
  else if (v === 'share') html = TPL_SHARE.replace('<?!= boot ?>', JSON.stringify((function(){var sb=B.api.shareBoot_(cfg); sb.here=cfg.publicUrl+'?v=s'; return sb;})()).replace(/</g, '\\u003c'));
  else { var bb = B.api.bookBoot_(cfg, v, v === 'friend' ? cfg.audiences.friend.token : ''); bb.here = cfg.publicUrl + (v === 'friend' ? '?v=f' : ''); html = TPL_BOOK.replace('<?!= boot ?>', JSON.stringify(bb).replace(/</g, '\\u003c')); }
  stage.innerHTML = '<div class="phone"><iframe id="frame" title="' + (v === 'admin' ? '後台' : v === 'friend' ? '朋友預約頁' : v === 'share' ? '分享的行程' : '新朋友預約頁') + '"></iframe></div>';
  document.getElementById('frame').srcdoc = html;
}

window.addEventListener('message', function (e) {
  var d = e.data;
  if (d && d.__gcReq) {
    setTimeout(function () {
      var res;
      try { res = { __gcRes: 1, id: d.id, ok: true, v: JSON.parse(JSON.stringify(B.api[d.fn].apply(null, d.args) || null)) }; }
      catch (err) { res = { __gcRes: 1, id: d.id, ok: false, err: err.message }; }
      e.source.postMessage(res, '*');
      badge();
    }, d.fn === 'adminParseImage' ? 2200 : (d.fn === 'adminEvents' && slowFirst) ? (slowFirst = false, 1400) : 160);   // 讓開場動畫和判讀等待看得到
  }
  if (d && d.__gcNav) {
    if (/macros\/s\/DEMO\/exec/.test(d.href)) show(/v=f/.test(d.href) ? 'friend' : /v=s/.test(d.href) ? 'share' : 'public');
    else toast('試玩版不會打開外部連結');
  }
});

document.querySelectorAll('.tabs button').forEach(function (b) { b.addEventListener('click', function () { show(b.dataset.v); }); });
document.getElementById('reset').addEventListener('click', function () { seed(); show(current); toast('已回到示範資料'); });

seed();
show('admin');
</script>
